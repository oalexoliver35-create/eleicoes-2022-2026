/* ----- eventos: busca de município na barra, tabelas e rankings ----- */
function ligarMunicipios() {
  const campo = $("mun"), lista = $("mun-sug");
  let ativos = [], idx = -1;
  const fechar = () => { lista.hidden = true; campo.setAttribute("aria-expanded", "false"); idx = -1; };
  const mostrar = () => {
    const p = MUN[estado.uf];
    if (!p) return fechar();
    const termo = semAcento(campo.value.trim());
    const comeca = m => m.chave.startsWith(termo) || (m.alt && m.alt.startsWith(termo));
    const contem = m => m.chave.includes(termo) || (m.alt && m.alt.includes(termo));
    ativos = (termo ? p.busca.filter(comeca).concat(p.busca.filter(m => !comeca(m) && contem(m))) : p.busca).slice(0, 50);
    lista.innerHTML = ativos.length
      ? ativos.map((m, i) => `<li role="option" data-cod="${m.cod}" aria-selected="${i === idx}">${esc(m.nome)}${p.paises && p.paises[m.cod] ? `<span class="menor">${esc(p.paises[m.cod][0])}</span>` : ""}</li>`).join("")
      : `<li aria-disabled="true">Nenhum resultado</li>`;
    lista.hidden = false;
    campo.setAttribute("aria-expanded", "true");
  };
  const escolher = cod => { fechar(); campo.blur(); selecionarMun(cod); };
  campo.addEventListener("focus", () => { campo.select(); mostrar(); });
  campo.addEventListener("input", () => { idx = -1; mostrar(); });
  campo.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!ativos.length) return;
      idx = (idx + (e.key === "ArrowDown" ? 1 : -1) + ativos.length) % ativos.length;
      mostrar();
      const li = lista.children[idx];
      if (li) li.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (!campo.value.trim()) { if (estado.mun) { estado.mun = null; fechar(); campo.blur(); atualizar(); } }
      else if (ativos.length) escolher(ativos[Math.max(idx, 0)].cod);
    } else if (e.key === "Escape") { campo.value = nomeMunAtual(); fechar(); campo.blur(); }
  });
  campo.addEventListener("search", () => { if (!campo.value && estado.mun) { estado.mun = null; atualizar(); } });
  campo.addEventListener("blur", () => setTimeout(() => { fechar(); campo.value = nomeMunAtual(); }, 150));
  lista.addEventListener("mousedown", e => {
    const li = e.target.closest("li[data-cod]");
    if (li) { e.preventDefault(); escolher(li.dataset.cod); }
  });

  const conteudo = $("conteudo");
  conteudo.addEventListener("click", e => {
    if (e.target.closest("[data-voltar]")) { estado.mun = null; atualizar(); return; }
    if (e.target.closest("#loc-dir")) { tab.desc = !tab.desc; e.target.closest("#loc-dir").textContent = tab.desc ? "↓ maior primeiro" : "↑ menor primeiro"; $("loc-corpo").innerHTML = corpoLocais(); return; }
    const tr = e.target.closest("tr[data-mun], tr[data-pais], tr[data-regiao], tr[data-rk-cod]");
    if (!tr) return;
    if (tr.dataset.rkCod) { estado.aba = rk.cargo; estado.uf = tr.dataset.rkUf; estado.regiao = estado.pais = ""; selecionarMun(tr.dataset.rkCod); return; }
    if (tr.dataset.mun) return selecionarMun(tr.dataset.mun);
    if (tr.dataset.pais) { estado.pais = tr.dataset.pais; const arv = arvoreExterior(); estado.regiao = Object.keys(arv).find(r => arv[r][estado.pais]) || ""; }
    else { estado.regiao = tr.dataset.regiao; estado.pais = ""; }
    estado.mun = null;
    atualizar();
    window.scrollTo({ top: 0 });
  });
  conteudo.addEventListener("input", e => {
    if (e.target.id === "loc-busca") { tab.busca = e.target.value; $("loc-corpo").innerHTML = corpoLocais(); }
  });
  conteudo.addEventListener("change", e => {
    const el = e.target;
    if (el.id === "loc-ordem") { tab.ordem = el.value; tab.desc = el.value !== "nome"; $("loc-dir").textContent = tab.desc ? "↓ maior primeiro" : "↑ menor primeiro"; $("loc-corpo").innerHTML = corpoLocais(); return; }
    if (el.id === "ext-regiao") { estado.regiao = el.value; estado.pais = ""; estado.mun = null; return atualizar(); }
    if (el.id === "ext-pais") {
      estado.pais = el.value; estado.mun = null;
      if (el.value) { const arv = arvoreExterior(); estado.regiao = Object.keys(arv).find(r => arv[r][el.value]) || ""; }
      return atualizar();
    }
    if (el.id === "ext-cidade") { if (el.value) return selecionarMun(el.value); estado.mun = null; return atualizar(); }
    if (el.dataset.rkCand) { rk.cand[el.dataset.rkCand] = el.value; return atualizar(); }
    if (el.dataset.rk) {
      const k = el.dataset.rk;
      rk[k] = el.type === "checkbox" ? el.checked : (k === "top" || k === "minimo") ? Number(el.value) : el.value;
      atualizar();
    }
  });
}

/* ---------- regiões (Norte, Nordeste, Centro-Oeste, Sudeste, Sul) ---------- */
/* DADOS.regioes = {UF: região} (mapeamento_regioes.csv). A região escolhida fica em estado.grupo, com
   estado.uf = "BR". Vale para Presidente e Deputados; Governador e Rankings não têm regiões. O Exterior
   não pertence a nenhuma região. Os totais da região são somados aqui, a partir dos blocos dos estados. */
const REGIAO_UF = DADOS.regioes || {};
const REGIOES = ["Norte", "Nordeste", "Centro-Oeste", "Sudeste", "Sul"];
const ufsDaRegiao = r => UFS.filter(uf => REGIAO_UF[uf] === r);
const abaTemRegiao = () => estado.aba !== "governador" && abaAtual().tipo !== "rank";
const alvoUf = () => (estado.uf === "BR" && estado.grupo ? ufsDaRegiao(estado.grupo) : estado.uf);
function blocoSoma(ano, cargo, turno, ufs) {
  const blocos = ufs.map(uf => bloco(ano, cargo, turno, uf)).filter(Boolean);
  if (!blocos.length) return null;
  const r = { aptos: 0, comparecimento: 0, abstencoes: 0, brancos: 0, nulos: 0, validos: 0, secoes_pct: 100, candidatos: [], locais: blocos.length };
  const porId = {};
  for (const b of blocos) {
    for (const k of ["aptos", "comparecimento", "abstencoes", "brancos", "nulos", "validos"]) r[k] += b[k];
    r.secoes_pct = Math.min(r.secoes_pct, b.secoes_pct);
    for (const c of b.candidatos) {
      const x = porId[c.id] = porId[c.id] || { id: c.id, pessoa: c.pessoa || "", nome: c.nome, partido: c.partido, votos: 0, pct: 0, situacao: "" };
      x.votos += c.votos;
    }
  }
  if (blocos.length < ufs.length) r.secoes_pct = Math.min(r.secoes_pct, 100 * blocos.length / ufs.length);
  r.candidatos = Object.values(porId).sort((a, b) => b.votos - a.votos || a.nome.localeCompare(b.nome));
  r.candidatos.forEach(c => { c.pct = r.validos ? 100 * c.votos / r.validos : 0; });
  return r;
}
function selecionarRegiao(regiao) {
  const mesma = estado.uf === "BR" && estado.grupo === regiao;
  mudarUf("BR");
  estado.grupo = mesma ? "" : regiao;  // clicar de novo na região ativa volta para o Brasil
  atualizar();
}
function montarMapaRegioes() {
  const M = DADOS.mapa;
  let svg = `<svg viewBox="0 0 ${M.largura} ${M.altura}" role="group" aria-label="Mapa das cinco regiões do Brasil">`;
  REGIOES.forEach((r, i) => {
    const g = M.regioes[r];
    svg += `<g class="reg" data-grupo="${r}" tabindex="0" role="button" aria-label="Região ${r}" style="--reg-cor:var(--regiao-${i + 1})"><title>Região ${r}</title><path d="${g.d}"/></g>`;
  });
  // os nomes vão por cima de todas as formas
  REGIOES.forEach(r => { const g = M.regioes[r]; svg += `<text class="reg-nome" data-nome="${r}" x="${g.cx}" y="${g.cy}">${r}</text>`; });
  $("mapa-regioes").innerHTML = svg + "</svg>";
}
function tabelaRegioes() {
  const t = estado.turno;
  const lider = (ano, r) => {
    const b = blocoSoma(ano, "presidente", t, ufsDaRegiao(r));
    if (!b || !b.candidatos.length || !b.validos) return `<td class="esq menor">—</td><td>—</td><td>—</td>`;
    const c = b.candidatos[0];
    return `<td class="esq">${esc(c.nome)} <span class="menor">${esc(c.partido)}</span></td><td>${fPct(c.pct)}</td><td>${fInt(b.validos)}</td>`;
  };
  const corpo = REGIOES.map(r => `<tr class="clicavel" data-grupo="${r}"><td>${r}<span class="sub2">${ufsDaRegiao(r).join(" ")}</span></td>${lider(A22, r)}${lider(A26, r)}</tr>`).join("");
  return `<section class="cartao" id="tab-regioes"><h3>1º colocado por região</h3>
    <p class="nota">Soma dos estados de cada região. Toque em uma linha (ou no mapa das regiões) para abrir a comparação da região. O exterior não pertence a nenhuma região.</p>
    <div class="rolagem tabela-mun"><table>
      <thead><tr><th>Região</th><th class="esq" colspan="2"><span class="amostra a2022"></span> 1º em 2022</th><th>Válidos 2022</th>
        <th class="esq" colspan="2"><span class="amostra a2026"></span> 1º em 2026</th><th>Válidos 2026</th></tr></thead>
      <tbody>${corpo}</tbody></table></div></section>`;
}

/* ---------- modo de cores do mapa: candidato a presidente mais votado em cada estado ---------- */
/* Liga pelos botões "Cores 2022" / "Cores 2026" ao lado do mapa (clicar no ativo desliga). Só muda as cores do
   mapa e a legenda: tabelas, cartões e seleção continuam iguais. Usa o ano do botão e o turno selecionado.
   A cor vem da pessoa (campo "pessoa" = nome civil + nascimento), não da posição: DADOS.cores_mapa lista as
   pessoas de cor fixa (Lula; Jair e Flávio Bolsonaro); qualquer outro vencedor recebe uma cor própria. */
const GRUPO_COR = {};
for (const [grupo, chaves] of Object.entries(DADOS.cores_mapa || {})) chaves.forEach(k => { GRUPO_COR[k] = grupo; });
let corMapa = null;  // null (visual normal), "2022" ou "2026"
function vencedoresMapa(anoKey, turno) {
  const out = {};
  for (const uf of UFS) {
    const b = bloco(ANOS[anoKey], "presidente", turno, uf);
    if (b && b.validos > 0 && b.candidatos.length) out[uf] = { c: b.candidatos[0], parcial: b.secoes_pct < 100 };
  }
  return out;
}
// Vencedores sem cor fixa, em ordem estável (nome), para cada um ter sempre a mesma cor nos dois anos e turnos.
const OUTROS_MAPA = (() => {
  const nomes = {};
  for (const ano of ["2022", "2026"]) for (const t of ["1", "2"]) {
    const lideres = Object.values(vencedoresMapa(ano, t)).map(v => v.c);
    for (const r of REGIOES) {  // quem lidera uma região pode não liderar nenhum estado
      const b = blocoSoma(ANOS[ano], "presidente", t, ufsDaRegiao(r));
      if (b && b.validos > 0) lideres.push(b.candidatos[0]);
    }
    for (const c of lideres) {
      const k = c.pessoa || c.id;
      if (!GRUPO_COR[k]) nomes[k] = c.nome;
    }
  }
  return Object.keys(nomes).sort((a, b) => nomes[a].localeCompare(nomes[b], "pt-BR") || a.localeCompare(b));
})();
function corDoVencedor(c) {
  const k = c.pessoa || c.id;
  return GRUPO_COR[k] ? `var(--mapa-${GRUPO_COR[k]})` : `var(--mapa-outro-${OUTROS_MAPA.indexOf(k) % 6 + 1})`;
}
function pintarMapa() {
  const svg = document.querySelector("#mapa svg"), legenda = $("mapa-legenda");
  document.querySelectorAll("#lateral [data-cor]").forEach(b => b.setAttribute("aria-pressed", b.dataset.cor === corMapa));
  $("mapa").classList.toggle("cores", !!corMapa);
  // O selecionado vai para o fim do desenho para a borda dele ficar por cima; o DF e o marcador ficam sempre no topo.
  const sel = svg.querySelector("g.uf.sel:not(.df-marca)");
  if (sel && sel.dataset.uf !== "DF") svg.appendChild(sel);
  [svg.querySelector('g.uf[data-uf="DF"]:not(.df-marca)'), svg.querySelector(".df-linha"), svg.querySelector("g.df-marca")].forEach(el => svg.appendChild(el));

  const t = estado.turno, venc = corMapa ? vencedoresMapa(corMapa, t) : {};
  // Região escolhida: os estados dela ficam em destaque no mapa principal; o mapa pequeno marca a região ativa.
  const daRegiao = estado.uf === "BR" && estado.grupo ? ufsDaRegiao(estado.grupo) : [];
  $("mapa").classList.toggle("com-regiao", daRegiao.length > 0);
  svg.querySelectorAll("g.uf").forEach(g => g.classList.toggle("na-regiao", daRegiao.includes(g.dataset.uf)));
  const svgReg = document.querySelector("#mapa-regioes svg");
  $("mapa-regioes").classList.toggle("cores", !!corMapa);
  svgReg.querySelectorAll("g.reg").forEach(g => {
    const r = g.dataset.grupo, ativa = estado.uf === "BR" && estado.grupo === r;
    const b = corMapa ? blocoSoma(ANOS[corMapa], "presidente", t, ufsDaRegiao(r)) : null;
    const lider = b && b.validos > 0 ? b.candidatos[0] : null;
    g.classList.toggle("sel", ativa);
    g.setAttribute("aria-pressed", ativa);
    g.classList.toggle("pintado", !!lider);
    if (lider) g.style.setProperty("--cor-uf", corDoVencedor(lider)); else g.style.removeProperty("--cor-uf");
    g.querySelector("title").textContent = `Região ${r}` + (lider ? `: ${lider.nome}, ${fPct(lider.pct)}` : "");
  });
  const ativa = svgReg.querySelector("g.reg.sel");
  if (ativa) svgReg.insertBefore(ativa, svgReg.querySelector("text"));  // a borda da região ativa fica por cima das outras
  svg.querySelectorAll("g.uf").forEach(g => {
    const v = venc[g.dataset.uf];
    g.classList.toggle("pintado", !!v);
    if (v) g.style.setProperty("--cor-uf", corDoVencedor(v.c)); else g.style.removeProperty("--cor-uf");
    g.querySelector("title").textContent = UF_NOME[g.dataset.uf] + (v ? `: ${v.c.nome}, ${fPct(v.c.pct)}` : "");
  });
  if (!corMapa) { legenda.hidden = true; legenda.innerHTML = ""; return; }
  const grupos = {};
  for (const v of Object.values(venc)) {
    const cor = corDoVencedor(v.c), g = grupos[cor] = grupos[cor] || { cor, nomes: [], ufs: 0 };
    if (!g.nomes.includes(v.c.nome)) g.nomes.push(v.c.nome);
    g.ufs++;
  }
  const itens = Object.values(grupos).sort((a, b) => b.ufs - a.ufs || a.nomes[0].localeCompare(b.nomes[0], "pt-BR"));
  const pintados = Object.keys(venc).length;
  let situacao = "";
  if (!pintados) situacao = corMapa === "2026" && !(t === "2" && bloco(A26, "presidente", "1", "BR") && !vaiTer2Turno(A26, "presidente", "BR"))
    ? "aguardando resultado" : (t === "2" ? "decidido no 1º turno" : "sem dados");
  else if (Object.values(venc).some(v => v.parcial) || pintados < UFS.length) situacao = "apuração parcial";
  legenda.hidden = false;
  legenda.innerHTML = `<p class="leg-tit">Presidente · ${ordinal(t)} · ${corMapa}: mais votado em cada estado</p>
    ${itens.length ? `<ul>${itens.map(g => `<li><span class="leg-cor" style="background:${g.cor}"></span><span>${esc(g.nomes.join(" / "))}</span><span class="leg-n">${g.ufs} ${g.ufs === 1 ? "UF" : "UFs"}</span></li>`).join("")}</ul>` : ""}
    ${situacao ? `<p class="leg-sit"><span class="leg-cor" style="background:var(--uf)"></span>${situacao}${pintados && pintados < UFS.length ? ` (${UFS.length - pintados} UFs sem resultado)` : ""}</p>` : ""}`;
}

/* ---------- deputados ---------- */
function bancada(ano, cargo, uf, mapear) {
  const fonte = ano && ano[cargo];
  if (!fonte) return null;
  const ufs = Array.isArray(uf) ? uf.filter(u => fonte[u]) : uf === "BR" ? Object.keys(fonte) : (fonte[uf] ? [uf] : []);
  if (!ufs.length) return null;
  const r = { vagas: 0, total: 0, partidos: {}, origem: {}, ufs: ufs.length };
  for (const u of ufs) {
    r.vagas += fonte[u].vagas;
    for (const [sigla, qtd] of Object.entries(fonte[u].partidos)) {
      const alvo = mapear && MAPA_PARTIDOS[sigla] ? MAPA_PARTIDOS[sigla].para : sigla;
      r.partidos[alvo] = (r.partidos[alvo] || 0) + qtd;
      r.total += qtd;
      const origem = r.origem[alvo] = r.origem[alvo] || {};
      origem[sigla] = (origem[sigla] || 0) + qtd;
    }
  }
  return r;
}
/* Nomes dos eleitos de um ano no local. "partido" é a sigla de comparação (ex.: PSC entra em PODE);
   "origem" é a sigla pela qual a pessoa foi eleita. O % é sobre os votos válidos do cargo na UF dela. */
let ELEITOS = { "2022": null, "2026": null };
function listaEleitos(ano, cargo, uf, mapear) {
  const fonte = ano && ano[cargo];
  if (!fonte) return null;
  const ufs = Array.isArray(uf) ? uf.filter(u => fonte[u]) : uf === "BR" ? Object.keys(fonte) : (fonte[uf] ? [uf] : []);
  if (!ufs.length) return null;
  const lista = [];
  for (const u of ufs) {
    for (const e of fonte[u].eleitos || []) {
      lista.push({
        nome: e.nome, origem: e.partido, uf: u, votos: e.votos,
        partido: mapear && MAPA_PARTIDOS[e.partido] ? MAPA_PARTIDOS[e.partido].para : e.partido,
        pct: fonte[u].validos ? 100 * e.votos / fonte[u].validos : null
      });
    }
  }
  return lista.sort((a, b) => b.votos - a.votos || a.nome.localeCompare(b.nome));
}
const semAcento = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function itemEleito(e, mostrarOrigem) {
  const marcas = (mostrarOrigem ? `<span class="partido">${esc(e.origem)}</span>` : "")
    + (estado.uf === "BR" ? `<span class="partido">${e.uf}</span>` : "");
  return `<li><div class="e-linha"><span class="e-nome">${esc(e.nome)} ${marcas}</span>
    <span class="e-votos">${fInt(e.votos)}</span><span class="e-pct">${e.pct === null ? "" : fDec(e.pct, 2) + "%"}</span></div></li>`;
}
function colunaEleitos(ano, sigla) {
  const cab = `<h4><span class="amostra a${ano}"></span> ${ano}`;
  const lista = ELEITOS[ano];
  if (!lista) return `<div class="det-col">${cab}</h4><p class="e-vazio">aguardando resultado</p></div>`;
  const doPartido = lista.filter(e => e.partido === sigla);
  if (!doPartido.length) return `<div class="det-col">${cab}</h4><p class="e-vazio">nenhum eleito</p></div>`;
  // Linha que soma siglas (fusão, incorporação ou mudança de nome): mostra a sigla de origem de cada um.
  const origem = doPartido.some(e => e.origem !== sigla);
  return `<div class="det-col" data-ano="${ano}">${cab} · ${doPartido.length} ${doPartido.length === 1 ? "eleito" : "eleitos"}</h4>
    <ol class="eleitos">${doPartido.map(e => itemEleito(e, origem)).join("")}</ol></div>`;
}
function alternarPartido(tr) {
  const aberto = tr.nextElementSibling && tr.nextElementSibling.classList.contains("detalhe");
  if (aberto) tr.nextElementSibling.remove();
  else {
    const sigla = tr.dataset.partido;
    tr.insertAdjacentHTML("afterend", `<tr class="detalhe"><td colspan="4"><div class="det-eleitos">
      ${colunaEleitos("2022", sigla)}${colunaEleitos("2026", sigla)}
      <p class="e-nota">Votos nominais e % dos votos válidos para o cargo no estado.</p></div></td></tr>`);
  }
  tr.classList.toggle("aberto", !aberto);
  tr.querySelector(".exp").setAttribute("aria-expanded", !aberto);
  tr.querySelector(".seta").textContent = aberto ? "▸" : "▾";
}
/* Painel "Ver todos os eleitos", com busca por nome ou partido. */
const todos = { ano: "2022", busca: "" };
function renderTodos() {
  const painel = document.getElementById("todos");
  if (!ELEITOS[todos.ano]) todos.ano = "2022";
  const lista = ELEITOS[todos.ano] || [];
  const termo = semAcento(todos.busca.trim());
  const achados = termo ? lista.filter(e => semAcento(`${e.nome} ${e.origem} ${e.partido}`).includes(termo)) : lista;
  const br = estado.uf === "BR";
  const linhas = achados.map((e, i) => `<tr><td>${i + 1}</td><td class="esq">${esc(e.nome)}</td>
    <td class="esq">${esc(e.origem)}${e.origem !== e.partido ? ` <span class="menor">(hoje ${esc(e.partido)})</span>` : ""}</td>
    ${br ? `<td class="esq">${e.uf}</td>` : ""}<td>${fInt(e.votos)}</td><td>${e.pct === null ? "" : fDec(e.pct, 2) + "%"}</td></tr>`).join("");
  const anos = ["2022", "2026"].map(a => `<button type="button" data-ano-todos="${a}" aria-pressed="${a === todos.ano}"${ELEITOS[a] ? "" : ` disabled title="aguardando resultado"`}>${a}</button>`).join("");
  const foco = document.activeElement && document.activeElement.id === "busca";
  painel.innerHTML = `<div class="todos-ctl">
      <input type="search" id="busca" placeholder="Buscar por nome ou partido" aria-label="Buscar por nome ou partido" value="${esc(todos.busca)}">
      <div class="seg" role="group" aria-label="Ano">${anos}</div>
    </div>
    <p class="e-nota" id="todos-conta">${fInt(achados.length)} de ${fInt(lista.length)} eleitos em ${todos.ano}${ELEITOS["2026"] ? "" : " · 2026: aguardando resultado"}</p>
    <div class="todos-lista"><table><thead><tr><th>#</th><th class="esq">Nome</th><th class="esq">Partido</th>${br ? `<th class="esq">UF</th>` : ""}<th>Votos</th><th>% dos válidos</th></tr></thead>
    <tbody>${linhas || `<tr><td colspan="${br ? 6 : 5}" class="esq">Nenhum eleito encontrado.</td></tr>`}</tbody></table></div>`;
  if (foco) { const campo = document.getElementById("busca"); campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
}
function ligarDeputados() {
  const conteudo = document.getElementById("conteudo");
  conteudo.addEventListener("click", e => {
    const tr = e.target.closest("tr.partido");
    if (tr) return alternarPartido(tr);
    const ano = e.target.closest("button[data-ano-todos]");
    if (ano && !ano.disabled) { todos.ano = ano.dataset.anoTodos; return renderTodos(); }
    const botao = e.target.closest("#ver-todos");
    if (botao) {
      const painel = document.getElementById("todos");
      painel.hidden = !painel.hidden;
      botao.setAttribute("aria-expanded", !painel.hidden);
      botao.textContent = (painel.hidden ? "Ver" : "Ocultar") + botao.textContent.replace(/^\S+/, "");
      if (!painel.hidden) { todos.busca = ""; renderTodos(); document.getElementById("busca").focus(); }
    }
  });
  conteudo.addEventListener("input", e => {
    if (e.target.id === "busca") { todos.busca = e.target.value; renderTodos(); }
  });
}
function celulaBancada(qtd, ano, escala, titulo) {
  if (qtd === null) return `<td class="celbarra menor">—</td>`;
  return `<td class="celbarra"><div class="nb"><span class="n">${qtd}</span>
    <div class="barra b${ano}" title="${esc(titulo)}"><i style="width:${(100 * qtd / escala).toFixed(2)}%${qtd ? "" : ";min-width:0"}"></i></div></div></td>`;
}
function renderDeputados() {
  const cargo = estado.aba, uf = estado.uf;
  const alvo = alvoUf();  // um estado, "BR" ou a lista de UFs da região escolhida
  const x = bancada(A22, cargo, alvo, true), y = bancada(A26, cargo, alvo, false);
  const siglas = new Set([...Object.keys(x ? x.partidos : {}), ...Object.keys(y ? y.partidos : {})]);
  const q22 = s => (x ? x.partidos[s] || 0 : null), q26 = s => (y ? y.partidos[s] || 0 : null);
  // Ordena pelos eleitos de 2026; enquanto 2026 não existe, pelos de 2022.
  const ordem = [...siglas].sort((a, b) => y
    ? (q26(b) - q26(a)) || (q22(b) - q22(a)) || a.localeCompare(b)
    : (q22(b) - q22(a)) || a.localeCompare(b));
  const escala = Math.max(1, ...ordem.map(s => Math.max(q22(s) || 0, q26(s) || 0)));
  const cadeira = cargo === "dep_federal" ? "deputados federais" : "deputados estaduais e distritais";

  const maior = (r, ano, motivo) => {
    const rot = `<div class="rot"><span class="amostra a${ano}"></span>Maior bancada em ${ano}</div>`;
    if (!r) return `<div class="tile espera">${rot}<div class="val">${motivo}</div></div>`;
    const top = Object.entries(r.partidos).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const lideres = top.filter(p => p[1] === top[0][1]).map(p => p[0]).join(", ");
    return `<div class="tile">${rot}<div class="val">${esc(lideres)} · ${top[0][1]}</div>
      <div class="det">${fInt(r.total)} ${cadeira} eleitos, ${top.length} partidos com eleitos</div></div>`;
  };
  let html = `<div class="destaques">${maior(x, "2022", "sem dados")}${maior(y, "2026", "aguardando resultado")}</div>`;

  const notas = [];
  let corpo = "";
  for (const s of ordem) {
    let ref = "";
    const origem = x && x.origem[s] ? Object.entries(x.origem[s]) : [];
    if (origem.length && !(origem.length === 1 && origem[0][0] === s)) {
      const partes = origem.sort((a, b) => b[1] - a[1]).map(([sg, q]) => `${sg} (${q})`).join(" + ");
      const obs = [...new Set(origem.map(([sg]) => MAPA_PARTIDOS[sg] && MAPA_PARTIDOS[sg].obs).filter(Boolean))].join("; ");
      notas.push(`<strong>${esc(s)}</strong>: o número de 2022 ${origem.length > 1 ? "é a soma de" : "veio de"} ${esc(partes)}.${obs ? " " + esc(obs) + "." : ""}`);
      ref = `<sup class="ref">${notas.length}</sup>`;
    }
    const a = q22(s), b = q26(s);
    corpo += `<tr class="partido" data-partido="${esc(s)}" title="Clique para ver os nomes dos eleitos">
      <td><button class="exp" type="button" aria-expanded="false"><span class="seta" aria-hidden="true">▸</span><strong>${esc(s)}</strong></button>${ref}</td>
      ${celulaBancada(a, "2022", escala, `${s} em 2022: ${a} eleitos`)}
      ${celulaBancada(b, "2026", escala, `${s} em 2026: ${b} eleitos`)}
      <td>${a !== null && b !== null ? fDif(b - a) : "—"}</td></tr>`;
  }
  corpo += `<tr class="total"><td>Total</td><td class="esq">${x ? fInt(x.total) : "—"}</td><td class="esq">${y ? fInt(y.total) : "—"}</td>
    <td>${x && y ? fDif(y.total - x.total) : "—"}</td></tr>`;
  let avisos = "";
  if (!y) avisos += `<div class="aviso">2026: aguardando resultado (eleição em ${DATA_TURNO_2026["1"]}). Tabela ordenada pelos eleitos de 2022.</div>`;
  else if (uf === "BR" && x && y.ufs < x.ufs) avisos += `<div class="aviso">2026: resultado disponível para ${y.ufs} de ${x.ufs} UFs.</div>`;
  const cab = (ano, r) => `<span class="amostra a${ano}"></span> ${ano}${r ? "" : ` <span class="pilula">aguardando resultado</span>`}`;
  ELEITOS = { "2022": listaEleitos(A22, cargo, alvo, true), "2026": listaEleitos(A26, cargo, alvo, false) };
  const onde = uf === "BR" ? (estado.grupo ? "da região" : "do Brasil") : "do estado";
  html += `<section class="cartao"><h3>Eleitos por partido</h3>
    <p class="nota">Conta o partido pelo qual cada deputado foi eleito (QP ou média). Suplentes e trocas de partido posteriores não entram.
      Clique em um partido para ver os nomes.</p>
    ${avisos}
    <p><button class="btn" id="ver-todos" type="button" aria-expanded="false" aria-controls="todos">Ver todos os eleitos ${onde}</button></p>
    <div class="todos" id="todos" hidden></div>
    <div class="rolagem"><table class="bancadas">
      <thead><tr><th>Partido</th><th class="esq">${cab("2022", x)}</th><th class="esq">${cab("2026", y)}</th><th>Diferença</th></tr></thead>
      <tbody>${corpo}</tbody></table></div>
    ${notas.length ? `<ol class="notas">${notas.map(n => `<li>${n}</li>`).join("")}</ol>` : ""}
    ${[A22, A26].map(ano => ano && ano.notas && ano.notas[cargo] ? `<p class="sub">${esc(ano.notas[cargo])}</p>` : "").join("")}
    ${federacoes(x, y)}</section>`;
  return html;
}
function federacoes(x, y) {
  const de26 = A26 && Object.keys(A26.federacoes || {}).length;
  const feds = de26 ? A26.federacoes : (A22.federacoes || {});
  const nomes = Object.keys(feds).sort();
  if (!nomes.length) return "";
  const soma = (r, membros) => (r ? membros.reduce((t, s) => t + (r.partidos[s] || 0), 0) : null);
  const linhas = nomes.map(nome => {
    // Em 2022 os membros já estão na sigla de comparação (ex.: PRD soma PTB + PATRIOTA).
    const membros = feds[nome];
    const a = soma(x, membros), b = soma(y, membros);
    return `<tr><td>${esc(nome)}<br><span class="menor">${esc(membros.join(" + "))}</span></td>
      <td>${a === null ? "—" : a}</td><td>${b === null ? "—" : b}</td><td>${a !== null && b !== null ? fDif(b - a) : "—"}</td></tr>`;
  }).join("");
  return `<details><summary>Subtotal por federação partidária (composição de ${de26 ? "2026" : "2022"})</summary>
    <div class="rolagem"><table><thead><tr><th>Federação</th><th>2022</th><th>2026</th><th>Diferença</th></tr></thead>
    <tbody>${linhas}</tbody></table></div>
    <p class="sub">Soma dos eleitos pelos partidos que compõem cada federação em ${de26 ? "2026" : "2022"}, aplicada aos dois anos.</p></details>`;
}

/* ---------- página ---------- */
function atualizar() {
  atualizarControles();
  const aba = abaAtual();
  let local = estado.uf === "BR" ? "Brasil" : estado.uf === "ZZ" ? "Exterior" : UF_NOME[estado.uf];
  let nivel = "";
  if (estado.uf === "BR" && estado.grupo) { local = `Região ${estado.grupo}`; nivel = " · região"; }
  if (aba.tipo === "maj" && estado.mun && nomeMunAtual()) {
    local = estado.uf === "ZZ" ? `${nomeMunAtual()} (${estado.pais || "exterior"})` : `${nomeMunAtual()} (${estado.uf})`;
    nivel = estado.uf === "ZZ" ? " · cidade no exterior" : " · município";
  } else if (aba.tipo === "maj" && estado.uf === "ZZ" && (estado.pais || estado.regiao)) {
    local = `Exterior: ${estado.pais || estado.regiao}`;
    nivel = estado.pais ? " · país" : " · região";
  }
  document.getElementById("titulo").textContent = aba.tipo === "rank" ? `Rankings: ${local}` : local;
  document.getElementById("subtitulo").textContent = aba.tipo === "maj"
    ? `${aba.nome} · ${ordinal(estado.turno)}${nivel} · 2022 × 2026`
    : aba.tipo === "rank" ? `Municípios ordenados pelos votos de um candidato · ${ordinal(estado.turno)}`
    : `${aba.id === "dep_federal" ? "Deputados federais" : "Deputados estaduais e distritais"} eleitos por partido${estado.grupo ? " · soma dos estados da região" : ""} · 2022 × 2026`;
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = aba.tipo === "maj" ? renderMajoritario() : aba.tipo === "rank" ? renderRankings() : renderDeputados();
  conteudo.querySelectorAll("tr[data-ir]").forEach(tr => tr.onclick = () => { mudarUf(tr.dataset.ir); atualizar(); window.scrollTo({ top: 0 }); });
  conteudo.querySelectorAll("tr[data-grupo]").forEach(tr => tr.onclick = () => { selecionarRegiao(tr.dataset.grupo); window.scrollTo({ top: 0 }); });
  const partes = [estado.mun || (estado.grupo ? "regiao:" + estado.grupo : ""), estado.regiao, estado.pais].map(encodeURIComponent);
  while (partes.length && !partes[partes.length - 1]) partes.pop();
  const extra = partes.length ? "/" + partes.join("/") : "";
  try { history.replaceState(null, "", `#${estado.aba}/${estado.turno}/${estado.uf}${extra}`); } catch (e) { /* arquivo local */ }
}
function rodape() {
  const tem26 = A26 && ["presidente", "governador", "dep_federal", "dep_estadual"].some(c => temResultado(A26, c));
  const avisos = tem26 && A26.avisos && A26.avisos.length ? `<p>Atenção em 2026: ${esc(A26.avisos.join("; "))}.</p>` : "";
  document.getElementById("rodape").innerHTML = `
    <p><strong>Fonte:</strong> Tribunal Superior Eleitoral (TSE).</p>
    <p>2022: ${esc(A22.fonte)}, dados gerados pelo TSE em ${esc(A22.atualizado_em)}.</p>
    <p>2026: ${tem26 ? `${esc(A26.fonte)}, última totalização em ${esc(A26.atualizado_em)}.` : "aguardando resultado (1º turno em 04/10/2026; eventual 2º turno em 25/10/2026)."}</p>
    ${avisos}
    <p>Fotos dos candidatos: fotos oficiais do registro de candidatura (TSE).</p>
    <p>Municípios: votação por município e zona (TSE), com nomes e códigos do IBGE. Exterior: cidades do TSE; país e região por tabela própria.</p>
    <p>Mapa: ${esc(DADOS.mapa.fonte)}.</p>
    <p>Site gerado em ${esc(DADOS.gerado_em)}.</p>`;
}
function tema() {
  const botao = document.getElementById("tema");
  const ordem = ["auto", "light", "dark"], nomes = { auto: "automático", light: "claro", dark: "escuro" };
  let atual = "auto";
  try { atual = localStorage.getItem("tema") || "auto"; } catch (e) { /* sem armazenamento */ }
  const aplicar = () => {
    if (atual === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", atual);
    botao.innerHTML = `◐<span class="so-largo"> Tema: ${nomes[atual]}</span>`;
    botao.toggleAttribute("data-manual", atual !== "auto");
    botao.title = botao.ariaLabel = "Tema: " + nomes[atual] + " (clique para alternar)";
  };
  botao.onclick = () => {
    atual = ordem[(ordem.indexOf(atual) + 1) % ordem.length];
    try { localStorage.setItem("tema", atual); } catch (e) { /* sem armazenamento */ }
    aplicar();
  };
  aplicar();
}
function lerHash() {
  const [aba, turno, uf, mun, regiao, pais] = location.hash.replace("#", "").split("/").map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  if (ABAS.some(a => a.id === aba)) estado.aba = aba;
  if (turno === "1" || turno === "2") estado.turno = turno;
  if (uf && UF_NOME[uf]) estado.uf = uf;
  if (mun && /^\d{5}$/.test(mun)) estado.mun = mun;
  if (mun && mun.startsWith("regiao:")) estado.grupo = mun.slice(7);
  estado.regiao = regiao || "";
  estado.pais = pais || "";
}
tema();
lerHash();
montarAbas();
montarMapa();
montarMapaRegioes();
ligarDeputados();
ligarMunicipios();
rodape();
atualizar();
</script>
