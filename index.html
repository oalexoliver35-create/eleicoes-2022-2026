<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleições 2022 × 2026</title>
<style>
:root {
  /* Paleta do site. Para ajustar as cores, mexa só aqui (tema claro) e nos dois blocos do tema escuro abaixo. */
  color-scheme: light;
  --bg: #f1f5f9;             /* fundo da página */
  --card: #ffffff;           /* cartões e barra do topo */
  --controle: #f8fafc;       /* botões, lista suspensa */
  --borda: #cbd5e1;          /* borda fina de cartões e controles */
  --linha: #e2e8f0;          /* divisórias dentro dos cartões */
  --hover: rgba(15, 23, 42, 0.05);
  --trilho: rgba(15, 23, 42, 0.07);  /* fundo das barras de percentual */
  --texto: #0f172a;
  --texto-suave: #475569;
  --destaque: #0f766e;       /* selecionado: abas, turno, tema, estado no mapa */
  --destaque-texto: #ffffff; /* texto sobre a cor de destaque */
  --cor-2022: #4a86c5;
  --cor-2026: #d8774a;
  --uf: #bfcad9;             /* estados no mapa */
  --uf-foco: #94a3b8;        /* estado sob o mouse */
  /* Modo "Cores 2022 / Cores 2026" do mapa: cor do candidato a presidente mais votado em cada estado. */
  --mapa-lula: #d6453d;              /* Lula: vermelho */
  --mapa-bolsonaro: var(--cor-2022); /* Jair e Flávio Bolsonaro: o mesmo azul das barras de 2022 */
  --mapa-outro-1: #6b3fa0;           /* outros vencedores, um por candidato (sem laranja nem turquesa) */
  --mapa-outro-2: #2f855a;
  --mapa-outro-3: #a8861a;
  --mapa-outro-4: #c24f8e;
  --mapa-outro-5: #8b6a47;
  --mapa-outro-6: #6f7f2a;
  /* Mapa pequeno das regiões: um tom neutro por região (Norte, Nordeste, Centro-Oeste, Sudeste, Sul). */
  --regiao-1: #9fb0c6;
  --regiao-2: #c3cedb;
  --regiao-3: #b1bfd1;
  --regiao-4: #8c9fb9;
  --regiao-5: #cbd4df;
  --altura-topo: 96px;       /* medido pelo script; não é cor */
}
/* Tema escuro: o mesmo bloco aparece duas vezes (sistema em modo escuro / botão de tema). Mantenha os dois iguais. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f172a;             /* fundo da página (azul-ardósia escuro) */
    --card: #1e293b;           /* cartões e barra do topo */
    --controle: #273449;       /* botões, lista suspensa */
    --borda: #334155;          /* borda fina de cartões e controles */
    --linha: #2d3b52;          /* divisórias dentro dos cartões */
    --hover: rgba(148, 163, 184, 0.12);
    --trilho: rgba(148, 163, 184, 0.16);  /* fundo das barras de percentual */
    --texto: #e2e8f0;
    --texto-suave: #94a3b8;
    --destaque: #2dd4bf;       /* selecionado: abas, turno, tema, estado no mapa */
    --destaque-texto: #0f172a; /* texto sobre a cor de destaque */
    --cor-2022: #5a8fce;
    --cor-2026: #d27548;
    --uf: #334155;             /* estados no mapa */
    --uf-foco: #52647d;        /* estado sob o mouse */
    --mapa-lula: #e0605a;
    --mapa-bolsonaro: var(--cor-2022);
    --mapa-outro-1: #a855f7;
    --mapa-outro-2: #3fa36b;
    --mapa-outro-3: #c29a1f;
    --mapa-outro-4: #d56aa3;
    --mapa-outro-5: #a98562;
    --mapa-outro-6: #8a9a3c;
    --regiao-1: #3d4d66;
    --regiao-2: #2f3d54;
    --regiao-3: #48597a;
    --regiao-4: #566a8a;
    --regiao-5: #354660;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f172a;             /* fundo da página (azul-ardósia escuro) */
  --card: #1e293b;           /* cartões e barra do topo */
  --controle: #273449;       /* botões, lista suspensa */
  --borda: #334155;          /* borda fina de cartões e controles */
  --linha: #2d3b52;          /* divisórias dentro dos cartões */
  --hover: rgba(148, 163, 184, 0.12);
  --trilho: rgba(148, 163, 184, 0.16);  /* fundo das barras de percentual */
  --texto: #e2e8f0;
  --texto-suave: #94a3b8;
  --destaque: #2dd4bf;       /* selecionado: abas, turno, tema, estado no mapa */
  --destaque-texto: #0f172a; /* texto sobre a cor de destaque */
  --cor-2022: #5a8fce;
  --cor-2026: #d27548;
  --uf: #334155;             /* estados no mapa */
  --uf-foco: #52647d;        /* estado sob o mouse */
  --mapa-lula: #e0605a;
  --mapa-bolsonaro: var(--cor-2022);
  --mapa-outro-1: #a855f7;
  --mapa-outro-2: #3fa36b;
  --mapa-outro-3: #c29a1f;
  --mapa-outro-4: #d56aa3;
  --mapa-outro-5: #a98562;
  --mapa-outro-6: #8a9a3c;
  --regiao-1: #3d4d66;
  --regiao-2: #2f3d54;
  --regiao-3: #48597a;
  --regiao-4: #566a8a;
  --regiao-5: #354660;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--texto);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
.pagina {
  max-width: 1280px; margin: 0 auto; padding: 16px 16px 48px;
  display: grid; grid-template-columns: clamp(260px, 27vw, 340px) minmax(0, 1fr); gap: 24px; align-items: start;
}

/* ---------- barra fixa: título, abas, local, turno e tema ---------- */
header.topo { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--borda); }
.barra-in {
  max-width: 1280px; margin: 0 auto; padding: 6px 16px 0;
  display: flex; flex-wrap: wrap; align-items: center; column-gap: 16px; row-gap: 2px;
}
.topo h1 { font-size: 1.05rem; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
.b-local { display: flex; align-items: center; gap: 8px; margin-left: auto; padding-bottom: 6px; }
.b-acoes { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
.btn {
  background: var(--controle); border: 1px solid var(--borda); border-radius: 8px;
  padding: 5px 10px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.so-estreito { display: none; }
nav.abas { display: flex; gap: 2px; overflow-x: auto; align-self: flex-end; }
nav.abas button {
  background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 10px 7px;
  cursor: pointer; color: var(--texto-suave); font-weight: 600; white-space: nowrap;
}
nav.abas button[aria-selected="true"] { color: var(--destaque); border-bottom-color: var(--destaque); }
select { background: var(--controle); border: 1px solid var(--borda); border-radius: 8px; padding: 5px 8px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--borda); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { background: var(--controle); border: 0; padding: 5px 12px; cursor: pointer; white-space: nowrap; }

/* ---------- mapa na lateral ---------- */
.lateral { position: sticky; top: calc(var(--altura-topo) + 16px); }
.mapa svg { display: block; width: 100%; height: auto; }
.uf { cursor: pointer; outline: none; }
.uf path, .uf circle { fill: var(--uf); stroke: var(--bg); stroke-width: 1; vector-effect: non-scaling-stroke; fill-rule: evenodd; }
.uf.foco path, .uf.foco circle, .uf:focus-visible path, .uf:focus-visible circle { fill: var(--uf-foco); }
.uf.sel path, .uf.sel circle { fill: var(--destaque); }
.uf.indisp { cursor: default; }
.uf.indisp path, .uf.indisp circle { fill: var(--uf); opacity: 0.35; }
.uf text { font-size: 15px; font-weight: 500; fill: var(--texto); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.uf.sel text { fill: var(--destaque-texto); }
.df-linha { stroke: var(--texto-suave); stroke-width: 0.75; opacity: 0.65; vector-effect: non-scaling-stroke; pointer-events: none; }
.mapa-nome { min-height: 1.5em; text-align: center; color: var(--texto-suave); font-size: 0.88rem; margin: 4px 0 8px; }
.mapa-botoes { display: flex; gap: 8px; justify-content: center; }
.mapa-botoes button.sel, #tema[data-manual], #abrir-mapa[aria-expanded="true"] { background: var(--destaque); color: var(--destaque-texto); border-color: var(--destaque); font-weight: 600; }
.mapa-cores { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
.mapa-cores button[aria-pressed="true"] { background: var(--destaque); color: var(--destaque-texto); border-color: var(--destaque); font-weight: 600; }
/* Modo de cores: o preenchimento mostra o vencedor; a seleção passa a ser uma borda grossa na cor do texto. */
.mapa.cores .uf path, .mapa.cores .uf circle { fill: var(--cor-uf, var(--uf)); }
.mapa.cores .uf.foco path, .mapa.cores .uf.foco circle, .mapa.cores .uf:focus-visible path, .mapa.cores .uf:focus-visible circle { fill: var(--cor-uf, var(--uf-foco)); filter: brightness(1.14); }
.mapa.cores .uf.sel path, .mapa.cores .uf.sel circle { fill: var(--cor-uf, var(--uf)); stroke: var(--texto); stroke-width: 3; }
.mapa.cores .uf.pintado text { fill: var(--card); }
.mapa.cores .uf.sel:not(.pintado) text { fill: var(--texto); }
/* Mapa pequeno das regiões, abaixo dos botões. No modo de cores usa a mesma regra do mapa dos estados. */
.mapa-regioes { max-width: 190px; margin: 12px auto 0; }
.mapa-regioes svg { display: block; width: 100%; height: auto; overflow: visible; }
.reg { cursor: pointer; outline: none; }
.reg path { fill: var(--reg-cor); stroke: var(--bg); stroke-width: 1; vector-effect: non-scaling-stroke; }
.reg:hover path, .reg:focus-visible path { stroke: var(--texto-suave); stroke-width: 2; }
.reg.sel path { stroke: var(--texto); stroke-width: 3; }
.reg-nome { font-size: 30px; font-weight: 600; fill: var(--texto); text-anchor: middle; dominant-baseline: central; pointer-events: none;
  paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
.mapa-regioes.cores .reg path { fill: var(--cor-uf, var(--uf)); }
/* estados da região escolhida em destaque no mapa principal */
.uf.na-regiao path, .uf.na-regiao circle { fill: var(--uf-foco); }
.mapa.cores.com-regiao .uf:not(.na-regiao) path, .mapa.cores.com-regiao .uf:not(.na-regiao) circle { opacity: 0.35; }
.lateral { max-height: calc(100vh - var(--altura-topo) - 24px); overflow-y: auto; }
.mapa-legenda { margin: 10px auto 0; max-width: 300px; font-size: 0.82rem; color: var(--texto-suave); }
.mapa-legenda p { margin: 0 0 4px; }
.mapa-legenda ul { list-style: none; margin: 0 0 4px; padding: 0; }
.mapa-legenda li, .mapa-legenda .leg-sit { display: flex; align-items: center; gap: 7px; padding: 1px 0; color: var(--texto); }
.mapa-legenda .leg-sit { color: var(--texto-suave); }
.leg-cor { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid var(--borda); }
.leg-n { margin-left: auto; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
.cabeca { margin: 0 0 16px; }
.seg button + button { border-left: 1px solid var(--borda); }
.seg button[aria-pressed="true"] { background: var(--destaque); color: var(--destaque-texto); font-weight: 600; }
h2.local { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--texto-suave); font-size: 0.9rem; margin: 2px 0 0; }

/* ---------- destaques ---------- */
.destaques { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin: 0 0 20px; }
.tile { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.tile .rot { display: flex; align-items: center; gap: 6px; color: var(--texto-suave); font-size: 0.82rem; }
.tile .val { font-size: 1.7rem; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; }
.tile .quem { font-weight: 600; overflow-wrap: anywhere; }
.tile .det { color: var(--texto-suave); font-size: 0.85rem; }
.tile.espera .val { font-size: 1.1rem; color: var(--texto-suave); font-weight: 500; padding: 8px 0; }
.com-foto { display: flex; align-items: center; gap: 10px; min-width: 0; }
.com-foto .corpo { flex: 1; min-width: 0; }
.tile .com-foto { margin: 4px 0 4px; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; object-fit: cover; background: var(--uf); display: block; box-shadow: 0 0 0 1px var(--borda); }
.avatar.g { width: 56px; height: 56px; }
.avatar.sem-foto { display: flex; align-items: center; justify-content: center; overflow: hidden; }
.avatar.sem-foto svg { width: 100%; height: 100%; fill: var(--texto-suave); }
.amostra { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.amostra.a2022 { background: var(--cor-2022); }
.amostra.a2026 { background: var(--cor-2026); }

/* ---------- cartões e tabelas ---------- */
section.cartao { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 16px; margin: 0 0 20px; }
section.cartao > h3 { margin: 0 0 4px; font-size: 1.05rem; }
section.cartao > p.nota { margin: 0 0 12px; color: var(--texto-suave); font-size: 0.85rem; }
.aviso { background: var(--hover); border-radius: 8px; padding: 8px 12px; font-size: 0.88rem; color: var(--texto); margin: 0 0 12px; }
.pilula { display: inline-block; border: 1px solid var(--borda); border-radius: 999px; padding: 1px 8px; font-size: 0.75rem; color: var(--texto-suave); font-weight: 500; white-space: nowrap; }

.cmp-cab, .cmp-linha { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) minmax(0, 1fr) 5.5rem; column-gap: 16px; align-items: center; }
.cmp-cab { font-size: 0.82rem; color: var(--texto-suave); font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--linha); }
.cmp-cab > div { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cmp-cab .fim, .cmp-linha .delta { justify-content: flex-end; text-align: right; }
.cmp-linha { padding: 10px 0; border-bottom: 1px solid var(--linha); }
.cmp-linha:last-child { border-bottom: 0; }
.pos { font-weight: 600; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
.cand { min-width: 0; }
.cand .ano-mini { display: none; }
.cand .linha1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cand .nome { font-weight: 600; overflow-wrap: anywhere; }
.cand .partido { color: var(--texto-suave); font-size: 0.85rem; }
.cand .linha2 { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.cand .linha2 .pct { font-weight: 600; }
.cand.vazio { color: var(--texto-suave); }
.barra { height: 8px; margin-top: 5px; border-radius: 999px; background: var(--trilho); overflow: hidden; }
.barra i { display: block; height: 100%; min-width: 3px; border-radius: 999px; }
.barra.b2022 i { background: var(--cor-2022); }
.barra.b2026 i { background: var(--cor-2026); }
.delta { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.delta small { display: block; font-weight: 400; color: var(--texto-suave); font-size: 0.75rem; }

table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 8px; border-bottom: 1px solid var(--linha); text-align: right; vertical-align: middle; }
th { font-size: 0.8rem; color: var(--texto-suave); font-weight: 600; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
tr:last-child td { border-bottom: 0; }
td.esq, th.esq { text-align: left; }
td .menor { color: var(--texto-suave); font-size: 0.85rem; }
tr.clicavel { cursor: pointer; }
tr.clicavel:hover td { background: var(--hover); }
tr.total td { font-weight: 600; border-top: 1px solid var(--texto-suave); }
tr.separada td { border-top: 2px solid var(--linha); }
.rolagem { overflow-x: auto; }
td.celbarra { width: 34%; }
.nb { display: flex; align-items: center; gap: 8px; }
.nb .n { width: 2.6em; text-align: right; font-weight: 600; flex: none; }
.nb .barra { flex: 1; margin-top: 0; }
sup.ref { color: var(--texto-suave); font-weight: 400; }
/* linhas de partido que abrem a lista de eleitos */
tr.partido { cursor: pointer; }
tr.partido:hover td, tr.partido.aberto td { background: var(--hover); }
tr.partido td:first-child { padding-left: 6px; border-radius: 6px 0 0 6px; }
button.exp { background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: baseline; gap: 6px; text-align: left; }
.seta { color: var(--destaque); display: inline-block; width: 1em; font-size: 1.15em; line-height: 1; }
tr.detalhe td { padding: 6px 0 14px; text-align: left; }
.det-eleitos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px; margin-left: 9px; padding: 4px 0 4px 14px; border-left: 2px solid var(--destaque); }
.det-col h4 { margin: 0 0 4px; font-size: 0.82rem; font-weight: 600; color: var(--texto-suave); display: flex; align-items: center; gap: 6px; }
ol.eleitos { margin: 0; padding-left: 2em; font-size: 0.9rem; }
ol.eleitos li { padding: 2px 0; }
ol.eleitos li::marker { color: var(--texto-suave); font-size: 0.85em; }
.e-linha { display: grid; grid-template-columns: minmax(0, 1fr) auto 4.2em; column-gap: 10px; align-items: baseline; }
.e-nome { overflow-wrap: anywhere; }
.e-nome .partido { color: var(--texto-suave); font-size: 0.8rem; margin-left: 4px; }
.e-votos, .e-pct { text-align: right; font-variant-numeric: tabular-nums; }
.e-pct, .e-vazio, .e-nota { color: var(--texto-suave); }
.e-vazio { margin: 0; font-size: 0.9rem; }
.e-nota { grid-column: 1 / -1; margin: 2px 0 0; font-size: 0.8rem; }
.todos { border: 1px solid var(--borda); border-radius: 10px; padding: 12px; margin: 0 0 16px; }
.todos-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.todos-ctl input { flex: 1; min-width: 180px; background: var(--controle); border: 1px solid var(--borda); border-radius: 8px; padding: 6px 10px; font: inherit; color: inherit; }
.todos-ctl .seg button:disabled { color: var(--texto-suave); cursor: default; opacity: 0.6; }
.todos-lista { max-height: 60vh; overflow: auto; }
.todos-lista th { position: sticky; top: 0; background: var(--card); }
ol.notas { margin: 12px 0 0; padding-left: 20px; color: var(--texto-suave); font-size: 0.85rem; }
details { margin-top: 14px; }
summary { cursor: pointer; color: var(--texto-suave); font-size: 0.9rem; }

footer { color: var(--texto-suave); font-size: 0.82rem; border-top: 1px solid var(--linha); padding-top: 14px; }
footer p { margin: 0 0 4px; }

/* ---------- município: busca na barra, tabelas de municípios, exterior e rankings ---------- */
.b-mun { position: relative; }
.b-mun input { width: 200px; background: var(--controle); border: 1px solid var(--borda); border-radius: 8px; padding: 5px 8px; font: inherit; color: inherit; }
.b-mun input:disabled { color: var(--texto-suave); }
.sugestoes { position: absolute; top: calc(100% + 4px); left: 0; min-width: 280px; max-height: 340px; overflow-y: auto; margin: 0; padding: 4px;
  list-style: none; background: var(--card); border: 1px solid var(--borda); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); z-index: 30; }
.sugestoes li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.sugestoes li .menor { color: var(--texto-suave); font-size: 0.8rem; }
.sugestoes li[aria-selected="true"], .sugestoes li:hover { background: var(--hover); }
.migalha { margin: 0 0 6px; }
button.link { background: none; border: 0; padding: 0; color: var(--destaque); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
.ferramentas { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 0 0 10px; }
.ferramentas input[type="search"], .ferramentas input[type="number"], .ferramentas select {
  background: var(--controle); border: 1px solid var(--borda); border-radius: 8px; padding: 5px 8px; font: inherit; color: inherit; }
.ferramentas input[type="search"] { flex: 1; min-width: 180px; }
.ferramentas input[type="number"] { width: 8em; }
.ferramentas label { display: inline-flex; align-items: center; gap: 6px; color: var(--texto-suave); font-size: 0.88rem; }
.ferramentas label select, .ferramentas label input { color: var(--texto); }
.tabela-mun { max-height: 70vh; overflow: auto; }
.tabela-mun th { position: sticky; top: 0; background: var(--card); z-index: 1; }
.tabela-mun td .nm { font-weight: 600; }
.tabela-mun td .sub2 { display: block; color: var(--texto-suave); font-size: 0.8rem; }
.tabela-mun th button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; font-weight: 600; }
.tabela-mun th button[aria-sort] { color: var(--destaque); }
.lado-a-lado { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.rk-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; margin: 0 0 12px; }
.rk-grade label { display: flex; flex-direction: column; gap: 3px; color: var(--texto-suave); font-size: 0.82rem; }
.rk-grade select, .rk-grade input { background: var(--controle); border: 1px solid var(--borda); border-radius: 8px; padding: 6px 8px; font: inherit; color: var(--texto); }
.rk-grade label.check { flex-direction: row; align-items: center; gap: 8px; padding-top: 18px; }
.rk-grade select:disabled, .rk-grade input:disabled { color: var(--texto-suave); }
.positivo::before { content: "▲ "; } .negativo::before { content: "▼ "; }

/* Telas pequenas: a barra continua fixa (mais baixa) e o mapa abre pelo botão "Mapa". */
@media (max-width: 979px) {
  .pagina { display: block; padding-top: 12px; }
  .so-estreito { display: inline-block; }
  .so-largo { display: none; }
  .barra-in { padding: 3px 12px 0; column-gap: 8px; row-gap: 0; }
  .topo h1 { font-size: 0.88rem; flex: 1; }
  .b-acoes { order: 2; padding-bottom: 0; gap: 6px; }
  nav.abas { order: 3; width: 100%; }
  nav.abas button { padding: 2px 8px 2px; font-size: 0.85rem; border-bottom-width: 2px; }
  .b-local { order: 4; width: 100%; margin-left: 0; padding: 3px 0 4px; gap: 6px; }
  .b-local select { flex: 1; min-width: 0; }
  .b-mun { flex: 1.2; min-width: 0; }
  .b-mun input { width: 100%; padding-top: 1px; padding-bottom: 1px; font-size: 0.85rem; }
  .sugestoes { min-width: 240px; }
  .topo .btn, .topo select, .topo .seg button { padding-top: 1px; padding-bottom: 1px; font-size: 0.85rem; }
  .lateral {
    display: none; position: fixed; top: var(--altura-topo); left: 0; right: 0; z-index: 15;
    background: var(--card); border-bottom: 1px solid var(--borda); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
    padding: 8px 16px 14px; max-height: calc(100vh - var(--altura-topo)); overflow-y: auto;
  }
  body.mapa-aberto .lateral { display: block; }
  .mapa { max-width: min(380px, calc(100vh - var(--altura-topo) - 110px)); margin: 0 auto; }
}
@media (max-width: 760px) {
  .det-eleitos { grid-template-columns: minmax(0, 1fr); row-gap: 12px; }
  .lado-a-lado { grid-template-columns: minmax(0, 1fr); }
  .tile .val { font-size: 1.45rem; }
  .cmp-cab { display: none; }
  .cmp-linha { grid-template-columns: 2rem minmax(0, 1fr); row-gap: 8px; align-items: start; }
  .cmp-linha .pos { grid-row: 1 / span 3; padding-top: 2px; }
  .cmp-linha .cand, .cmp-linha .delta { grid-column: 2; }
  .cmp-linha .delta { text-align: left; font-size: 0.88rem; }
  .cmp-linha .delta small { display: inline; margin-left: 4px; }
  .cand .ano-mini { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--texto-suave); margin-bottom: 1px; }
  th, td { padding: 7px 5px; font-size: 0.88rem; }
  td.celbarra { width: 30%; }
  .nb .n { width: 2em; }
}
</style>
</head>
<body>
<header class="topo" id="barra">
  <div class="barra-in">
    <h1>Eleições 2022 × 2026</h1>
    <nav class="abas" id="abas" role="tablist"></nav>
    <div class="b-local">
      <select id="uf" aria-label="Local"></select>
      <div class="b-mun" id="b-mun" hidden>
        <input type="search" id="mun" placeholder="Município" autocomplete="off" spellcheck="false"
          role="combobox" aria-label="Município (busca)" aria-expanded="false" aria-controls="mun-sug" aria-autocomplete="list">
        <ul class="sugestoes" id="mun-sug" role="listbox" hidden></ul>
      </div>
      <div class="seg" id="turno" role="group" aria-label="Turno"></div>
    </div>
    <div class="b-acoes">
      <button class="btn so-estreito" id="abrir-mapa" type="button" aria-expanded="false" aria-controls="lateral">Mapa</button>
      <button class="btn" id="tema" type="button"></button>
    </div>
  </div>
</header>
<div class="pagina">
  <aside class="lateral" id="lateral" aria-label="Escolha do local no mapa">
    <div class="mapa" id="mapa"></div>
    <div class="mapa-nome" id="mapa-nome" aria-hidden="true"></div>
    <div class="mapa-botoes">
      <button class="btn" type="button" data-uf="BR">Brasil</button>
      <button class="btn" type="button" data-uf="ZZ">Exterior</button>
    </div>
    <div class="mapa-cores" role="group" aria-label="Pintar o mapa pelo candidato a presidente mais votado em cada estado">
      <button class="btn" type="button" data-cor="2022" aria-pressed="false">Cores 2022</button>
      <button class="btn" type="button" data-cor="2026" aria-pressed="false">Cores 2026</button>
    </div>
    <div class="mapa-regioes" id="mapa-regioes" aria-label="Regiões do Brasil"></div>
    <div class="mapa-legenda" id="mapa-legenda" hidden></div>
  </aside>
  <div class="principal">
    <div class="cabeca">
      <h2 class="local" id="titulo"></h2>
      <p class="sub" id="subtitulo"></p>
    </div>
    <main id="conteudo"></main>
    <footer id="rodape"></footer>
  </div>
</div>

"use strict";
const DADOS = JSON.parse(document.getElementById("dados").textContent);
const A22 = DADOS.anos["2022"];
const A26 = DADOS.anos["2026"] || null;
const MAPA_PARTIDOS = {};
for (const m of DADOS.mapeamento) MAPA_PARTIDOS[m.de] = m;

const UF_NOME = {
  AC: "Acre", AL: "Alagoas", AM: "Amazonas", AP: "Amapá", BA: "Bahia", CE: "Ceará", DF: "Distrito Federal",
  ES: "Espírito Santo", GO: "Goiás", MA: "Maranhão", MG: "Minas Gerais", MS: "Mato Grosso do Sul",
  MT: "Mato Grosso", PA: "Pará", PB: "Paraíba", PE: "Pernambuco", PI: "Piauí", PR: "Paraná",
  RJ: "Rio de Janeiro", RN: "Rio Grande do Norte", RO: "Rondônia", RR: "Roraima", RS: "Rio Grande do Sul",
  SC: "Santa Catarina", SE: "Sergipe", SP: "São Paulo", TO: "Tocantins", BR: "Brasil", ZZ: "Exterior"
};
const UFS = Object.keys(UF_NOME).filter(u => u !== "BR" && u !== "ZZ").sort((a, b) => UF_NOME[a].localeCompare(UF_NOME[b], "pt-BR"));
const ABAS = [
  { id: "presidente", nome: "Presidente", tipo: "maj" },
  { id: "governador", nome: "Governador", tipo: "maj" },
  { id: "dep_federal", nome: "Dep. Federal", tipo: "prop" },
  { id: "dep_estadual", nome: "Dep. Estadual", tipo: "prop" },
  { id: "rankings", nome: "Rankings", tipo: "rank" }
];
const DATA_TURNO_2026 = { "1": "04/10/2026", "2": "25/10/2026" };
// mun = código TSE do município (ou da cidade do exterior); regiao/pais = recorte do exterior.
// grupo = região do Brasil escolhida (com uf = "BR"); regiao/pais acima são só do exterior.
const estado = { aba: "presidente", turno: "1", uf: "BR", mun: null, regiao: "", pais: "", grupo: "" };

/* ---------- formatação pt-BR ---------- */
const fInt = n => Number(n).toLocaleString("pt-BR");
const fDec = (n, c = 1) => Number(n).toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
const fPct = n => fDec(n) + "%";
function fCurto(n) {
  if (n >= 1e6) return fDec(n / 1e6) + " mi";
  if (n >= 1e3) return fDec(n / 1e3) + " mil";
  return fInt(n);
}
function fDelta(d, unidade) {
  const v = fDec(Math.abs(d));
  if (v === "0,0") return "= 0,0" + unidade;
  return (d > 0 ? "▲ +" : "▼ −") + v + unidade;
}
function fDeltaVotos(d) {
  if (d === 0) return "mesmos votos";
  return (d > 0 ? "+" : "−") + fCurto(Math.abs(d)) + " votos";
}
function fDif(d) {
  if (d === 0) return "= 0";
  return (d > 0 ? "▲ +" : "▼ −") + Math.abs(d);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ordinal = t => t + "º turno";

/* ---------- acesso aos dados ---------- */
const abaAtual = () => ABAS.find(a => a.id === estado.aba);
const bloco = (ano, cargo, turno, uf) => (ano && ano[cargo] && ano[cargo][turno] && ano[cargo][turno][uf]) || null;
const temResultado = (ano, cargo) => !!(ano && ano[cargo] && Object.keys(ano[cargo]).length);

function ufsDaAba() {
  const aba = estado.aba;
  if (aba === "presidente") return ["BR", ...UFS, "ZZ"];
  if (aba === "governador") return UFS;
  return ["BR", ...UFS];
}
function ufDisponivel(uf) {
  if (abaAtual().tipo !== "maj") return true;
  if (estado.turno === "1") return true;
  return !!(bloco(A22, estado.aba, "2", uf) || bloco(A26, estado.aba, "2", uf) || vaiTer2Turno(A26, estado.aba, uf));
}
function vaiTer2Turno(ano, cargo, uf) {
  // Presidente: a decisão é nacional. Governador: da própria UF.
  const b = bloco(ano, cargo, "1", cargo === "presidente" ? "BR" : uf);
  return !!b && b.candidatos.some(c => /2.*turno/i.test(c.situacao || ""));
}
/* Por que um ano não tem dados nesta visão. */
function motivoSemDados(ano, rotuloAno) {
  const cargo = estado.aba, uf = estado.uf;
  if (ano && estado.turno === "2" && bloco(ano, cargo, "1", cargo === "presidente" ? "BR" : uf) && !vaiTer2Turno(ano, cargo, uf)) {
    return "decidido no 1º turno";
  }
  return rotuloAno === "2026" ? "aguardando resultado" : "sem dados";
}

/* ---------- controles ---------- */
function montarAbas() {
  const nav = document.getElementById("abas");
  nav.innerHTML = ABAS.map(a => `<button type="button" role="tab" data-aba="${a.id}" aria-selected="${a.id === estado.aba}">${a.nome}</button>`).join("");
  nav.onclick = e => {
    const b = e.target.closest("button[data-aba]");
    if (b) { estado.aba = b.dataset.aba; atualizar(); }
  };
}
const nomeLocal = uf => (uf === "BR" ? "Brasil" : uf === "ZZ" ? "Exterior" : `${UF_NOME[uf]} (${uf})`);
function focoMapa(uf) {
  document.querySelectorAll("#mapa .uf").forEach(g => g.classList.toggle("foco", g.dataset.uf === uf));
  document.getElementById("mapa-nome").textContent = !uf && estado.uf === "BR" && estado.grupo ? `Região ${estado.grupo}` : nomeLocal(uf || estado.uf);
}
function fecharMapa() {
  document.body.classList.remove("mapa-aberto");
  document.getElementById("abrir-mapa").setAttribute("aria-expanded", "false");
}
function montarMapa() {
  // Malha do IBGE já convertida em traçados SVG (pipeline/00_baixar_mapa.py).
  const M = DADOS.mapa;
  const forma = (uf, classe, miolo) => `<g class="uf ${classe}" data-uf="${uf}" tabindex="0" role="button" aria-label="${UF_NOME[uf]}"><title>${UF_NOME[uf]}</title>${miolo}</g>`;
  // O DF vai por último para ficar por cima de Goiás.
  const ordem = Object.keys(M.ufs).sort((a, b) => (a === "DF") - (b === "DF"));
  let svg = `<svg viewBox="0 0 ${M.largura} ${M.altura}" role="group" aria-label="Mapa do Brasil por estado">`;
  for (const uf of ordem) svg += forma(uf, "", `<path d="${M.ufs[uf].d}"/>`);
  // O DF é minúsculo: ganha um círculo ampliado no oceano, ligado a ele por uma linha.
  const df = M.ufs.DF, raio = 16, mx = M.largura - 22, my = df.cy + 12;
  svg += `<line class="df-linha" x1="${df.cx}" y1="${df.cy}" x2="${mx - raio}" y2="${my}"/>`;
  svg += forma("DF", "df-marca", `<circle cx="${mx}" cy="${my}" r="${raio}"/><text x="${mx}" y="${my}">DF</text>`);
  document.getElementById("mapa").innerHTML = svg + "</svg>";

  const lateral = document.getElementById("lateral");
  const escolher = alvo => {
    const el = alvo.closest("[data-uf]");
    if (!el || el.disabled || el.classList.contains("indisp")) return;
    mudarUf(el.dataset.uf);
    fecharMapa();
    atualizar();
  };
  lateral.onclick = e => {
    const cor = e.target.closest("[data-cor]");
    if (cor) { corMapa = corMapa === cor.dataset.cor ? null : cor.dataset.cor; pintarMapa(); return; }
    const reg = e.target.closest("[data-grupo]");
    if (reg) { fecharMapa(); selecionarRegiao(reg.dataset.grupo); return; }
    escolher(e.target);
  };
  lateral.onkeydown = e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.closest("g.uf")) { e.preventDefault(); escolher(e.target); }
    if ((e.key === "Enter" || e.key === " ") && e.target.closest("g.reg")) { e.preventDefault(); fecharMapa(); selecionarRegiao(e.target.closest("g.reg").dataset.grupo); }
  };
  lateral.onmouseover = e => { const el = e.target.closest("[data-uf]"); focoMapa(el ? el.dataset.uf : null); };
  lateral.onmouseleave = () => focoMapa(null);
  document.getElementById("abrir-mapa").onclick = e => {
    const aberto = document.body.classList.toggle("mapa-aberto");
    e.currentTarget.setAttribute("aria-expanded", aberto);
  };
  // A lateral e o painel do mapa ficam logo abaixo da barra fixa, qualquer que seja a altura dela.
  const barra = document.getElementById("barra");
  const medir = () => document.documentElement.style.setProperty("--altura-topo", barra.offsetHeight + "px");
  if (window.ResizeObserver) new ResizeObserver(medir).observe(barra);
  window.addEventListener("resize", medir);
  medir();

  document.getElementById("uf").onchange = e => {
    const v = e.target.value;
    if (v.startsWith("R:")) { mudarUf("BR"); estado.grupo = v.slice(2); } else mudarUf(v);
    atualizar();
  };
  document.getElementById("turno").onclick = e => {
    const b = e.target.closest("button[data-turno]");
    if (b) { estado.turno = b.dataset.turno; atualizar(); }
  };
}
function atualizarControles() {
  const aba = abaAtual();
  const validas = ufsDaAba();
  if (aba.tipo === "prop") estado.turno = "1";
  if (!validas.includes(estado.uf)) mudarUf(validas.includes("BR") ? "BR" : "SP");
  if (!ufDisponivel(estado.uf)) mudarUf(validas.find(ufDisponivel) || estado.uf);
  // Busca de município (ou de cidade do exterior) na barra: só em Presidente/Governador com um estado aberto.
  const comMun = aba.tipo === "maj" && estado.uf !== "BR";
  if (!comMun) estado.mun = null;
  if (estado.uf !== "ZZ") estado.regiao = estado.pais = "";
  const campoMun = $("mun");
  $("b-mun").hidden = !comMun;
  if (comMun) {
    const pronto = carregarMun(estado.uf, atualizar);
    if (pronto && estado.mun && !MUN[estado.uf].nomes[estado.mun]) estado.mun = null;
    campoMun.disabled = !pronto;
    campoMun.placeholder = pronto ? (estado.uf === "ZZ" ? "Cidade no exterior" : "Município") : (MUN_FALHA[estado.uf] ? "Municípios indisponíveis" : "Carregando…");
    if (document.activeElement !== campoMun) campoMun.value = nomeMunAtual();
  }

  // Regiões: só com o Brasil escolhido, e só em Presidente e Deputados.
  if (estado.uf !== "BR" || !abaTemRegiao() || !REGIOES.includes(estado.grupo)) estado.grupo = "";
  document.querySelectorAll("#abas button").forEach(b => b.setAttribute("aria-selected", b.dataset.aba === estado.aba));
  document.querySelectorAll("#lateral [data-uf]").forEach(el => {
    const uf = el.dataset.uf, valida = validas.includes(uf), disponivel = valida && ufDisponivel(uf);
    if (el.tagName === "BUTTON") { el.hidden = !valida; el.disabled = !disponivel; }
    else el.classList.toggle("indisp", !disponivel);
    const ativo = uf === estado.uf && !(uf === "BR" && estado.grupo);  // com uma região aberta, "Brasil" não fica marcado
    el.classList.toggle("sel", ativo);
    el.setAttribute("aria-pressed", ativo);
  });
  $("mapa-regioes").hidden = !abaTemRegiao();
  focoMapa(null);
  pintarMapa();
  const sel = document.getElementById("uf");
  sel.innerHTML = validas.map(uf => {
    const nome = uf === "BR" ? (estado.aba === "dep_estadual" ? "Brasil (soma das UFs)" : "Brasil") : uf === "ZZ" ? "Exterior" : `${UF_NOME[uf]} (${uf})`;
    return `<option value="${uf}"${ufDisponivel(uf) ? "" : " disabled"}${uf === estado.uf && !estado.grupo ? " selected" : ""}>${nome}</option>`;
  }).join("") + (abaTemRegiao() ? `<optgroup label="Regiões">${REGIOES.map(r => `<option value="R:${r}"${estado.grupo === r ? " selected" : ""}>Região ${r}</option>`).join("")}</optgroup>` : "");
  const seg = document.getElementById("turno");
  seg.hidden = aba.tipo === "prop";
  seg.innerHTML = ["1", "2"].map(t => `<button type="button" data-turno="${t}" aria-pressed="${t === estado.turno}">${ordinal(t)}</button>`).join("");
}

/* ---------- presidente e governador ---------- */
/* Foto oficial do TSE, casada pela chave do candidato (id). Sem foto: ícone neutro. */
const FOTOS = DADOS.fotos || {};
const ICONE_PESSOA = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="4.2"/><path d="M3.5 22c.6-5 4.1-7.6 8.5-7.6s7.900 2.600 8.500 7.600z"/></svg>`;
function avatar(c, ano, grande) {
  const b64 = c.id && FOTOS[ano] && FOTOS[ano][c.id];

  return b64
    ? `<img class="${classe}" src="data:image/jpeg;base64,${b64}" alt="" width="${lado}" height="${lado}">`

}
function celulaCandidato(c, ano, escala, mostrarSituacao, motivo) {
  const mini = `<span class="ano-mini"><span class="amostra a${ano}"></span>${ano}</span>`;
  if (!c) return `<div class="cand vazio">${mini}<div>${motivo ? esc(motivo) : "—"}</div></div>`;
  const tag = mostrarSituacao && /^eleito|2.*turno/i.test(c.situacao || "") ? `<span class="pilula">${esc(c.situacao.toLowerCase())}</span>` : "";
  const larg = Math.max(0, Math.min(100, 100 * c.pct / escala));
  return `<div class="cand" data-id="${esc(c.id || "")}">${mini}
    <div class="com-foto">${avatar(c, ano, false)}<div class="corpo">
      <div class="linha1"><span class="nome">${esc(c.nome)}</span><span class="partido">${esc(c.partido)}</span>${tag}</div>
      <div class="linha2"><span class="votos">${fInt(c.votos)}</span><span class="pct">${fPct(c.pct)}</span></div>
      <div class="barra b${ano}" title="${esc(c.nome)} (${ano}): ${fInt(c.votos)} votos, ${fPct(c.pct)} dos válidos"><i style="width:${larg.toFixed(2)}%"></i></div>
    </div></div>
  </div>`;
}
function tileLider(b, ano, motivo) {
  const rot = `<div class="rot"><span class="amostra a${ano}"></span>1º colocado em ${ano}</div>`;
  if (!b || !b.candidatos.length) return `<div class="tile espera">${rot}<div class="val">${esc(motivo)}</div></div>`;
  const [p, s] = b.candidatos;
  const vantagem = (s ? `Vantagem sobre o 2º: ${fCurto(p.votos - s.votos)} votos (${fDec(p.pct - s.pct)} p.p.)` : "Candidato único")
    + (estado.uf === "ZZ" ? ` · ${fInt(p.votos)} de ${fInt(b.validos)} votos válidos` : "");
  return `<div class="tile" data-id="${esc(p.id || "")}">${rot}
    <div class="com-foto">${avatar(p, ano, true)}<div class="corpo">
      <div class="val">${fCurto(p.votos)} · ${fPct(p.pct)}</div>
      <div class="quem">${esc(p.nome)} <span class="det">(${esc(p.partido)})</span></div>
    </div></div>

}
function tabelaContexto(b22, b26, m22, m26) {
  const linhas = [
    ["Eleitorado apto", "aptos", null],
    ["Comparecimento", "comparecimento", "aptos"],
    ["Abstenção", "abstencoes", "aptos"],
    ["Votos válidos", "validos", "comparecimento"],
    ["Votos brancos", "brancos", "comparecimento"],
    ["Votos nulos", "nulos", "comparecimento"]
  ];
  const parte = (b, campo, base) => {
    if (!b) return { n: "—", p: "", v: null };
    const v = base && b[base] ? 100 * b[campo] / b[base] : null;
    return { n: fInt(b[campo]), p: v === null ? "" : fPct(v), v };
  };
  let corpo = "";
  for (const [rotulo, campo, base] of linhas) {
    const x = parte(b22, campo, base), y = parte(b26, campo, base);
    let dif = "—";
    if (b22 && b26) dif = base ? fDelta(y.v - x.v, " p.p.") : fDelta(100 * (b26[campo] - b22[campo]) / b22[campo], "%");
    corpo += `<tr><td>${rotulo}</td><td>${x.n}</td><td class="menor">${x.p}</td><td>${y.n}</td><td class="menor">${y.p}</td><td>${dif}</td></tr>`;
  }
  const cab = (ano, b, motivo) => `<span class="amostra a${ano}"></span> ${ano}${b ? "" : ` <span class="pilula">${esc(motivo)}</span>`}`;
  return `<section class="cartao"><h3>Eleitorado e comparecimento</h3>
    <p class="nota">Comparecimento e abstenção em % do eleitorado apto; válidos, brancos e nulos em % do comparecimento.</p>
    <div class="rolagem"><table>
      <thead><tr><th></th><th colspan="2">${cab("2022", b22, m22)}</th><th colspan="2">${cab("2026", b26, m26)}</th><th>Variação</th></tr></thead>
      <tbody>${corpo}</tbody></table></div></section>`;
}
function tabelaPorEstado(ufs, titulo) {
  const t = estado.turno;
  const lider = (ano, uf) => {
    const b = bloco(ano, "presidente", t, uf);
    if (!b || !b.candidatos.length) return `<td class="esq menor">—</td><td>—</td>`;
    const c = b.candidatos[0];
    return `<td class="esq">${esc(c.nome)} <span class="menor">${esc(c.partido)}</span></td><td>${fPct(c.pct)}</td>`;
  };
  const linha = (uf, classe) => `<tr class="clicavel ${classe}" data-ir="${uf}"><td>${esc(UF_NOME[uf])}</td>${lider(A22, uf)}${lider(A26, uf)}</tr>`;
  const corpo = (ufs || UFS).map(uf => linha(uf, "")).join("") + (ufs ? "" : linha("ZZ", "separada"));
  return `<section class="cartao" id="tab-estados"><h3>${esc(titulo || "1º colocado por estado")}</h3>
    <p class="nota">Toque em uma linha para abrir a comparação completa.${ufs ? "" : " Os votos do exterior entram só no total nacional."}</p>
    <div class="rolagem"><table>
      <thead><tr><th>UF</th><th class="esq" colspan="2"><span class="amostra a2022"></span> 2022</th><th class="esq" colspan="2"><span class="amostra a2026"></span> 2026</th></tr></thead>
      <tbody>${corpo}</tbody></table></div></section>`;
}
function renderMajoritario() {
  const cargo = estado.aba, t = estado.turno, uf = estado.uf;
  const v = vista();  // estado, município ou recorte do exterior
  const b22 = v.b22, b26 = v.b26, m22 = b22 ? "" : v.m22, m26 = b26 ? "" : v.m26;
  const c22 = b22 ? b22.candidatos : [], c26 = b26 ? b26.candidatos : [];
  const n = Math.max(c22.length, c26.length);
  const escala = Math.max(1, ...c22.map(c => c.pct), ...c26.map(c => c.pct));
  const situ = !v.sub && (cargo === "governador" || uf === "BR");

  let html = v.topo + `<div class="destaques">${tileLider(b22, "2022", m22)}${tileLider(b26, "2026", m26)}</div>`;
  let avisos = "";
  if (!b26 && m26 === "aguardando resultado") avisos += `<div class="aviso">2026: aguardando resultado (${ordinal(t)} em ${DATA_TURNO_2026[t]}).</div>`;
  if (b26 && b26.secoes_pct < 100) avisos += `<div class="aviso">2026: apuração parcial, ${fDec(b26.secoes_pct, 2)}% das seções totalizadas.</div>`;
  const cab = (ano, b, motivo) => `<div><span class="amostra a${ano}"></span> ${ano}${b ? "" : ` <span class="pilula">${esc(motivo)}</span>`}</div>`;
  let linhas = "";
  for (let i = 0; i < n; i++) {
    const x = c22[i], y = c26[i];
    const delta = x && y ? `${fDelta(y.pct - x.pct, " p.p.")}<small>${fDeltaVotos(y.votos - x.votos)}</small>` : "—";
    linhas += `<div class="cmp-linha"><div class="pos">${i + 1}º</div>
      ${celulaCandidato(x, "2022", escala, situ, i === 0 ? m22 : "")}
      ${celulaCandidato(y, "2026", escala, situ, i === 0 ? m26 : "")}
      <div class="delta">${delta}</div></div>`;
  }
  if (!n) linhas = `<div class="aviso">Não houve ${ordinal(t)} neste local em nenhum dos dois anos.</div>`;
  html += `<section class="cartao"><h3>Candidatos por posição</h3>
    <p class="nota">Votos nominais e % dos votos válidos. A variação compara a mesma posição nos dois anos, não o mesmo candidato.</p>
    ${avisos}
    <div class="cmp-cab"><div>Pos.</div>${cab("2022", b22, m22)}${cab("2026", b26, m26)}<div class="fim">Variação</div></div>
    ${linhas}</section>`;
  html += v.meio;  // no Brasil: resumo das cinco regiões, logo abaixo de "Candidatos por posição"
  if (b22 || b26) html += tabelaContexto(b22, b26, m22, m26);
  if (cargo === "presidente" && uf === "BR" && !estado.grupo) html += tabelaPorEstado();
  return html + v.rodape;
}


/* ---------- municípios, exterior e rankings ---------- */
/* Os dados por município ficam em municipios/<UF>.js (um por estado; ZZ = exterior) e só são carregados
   quando o estado é aberto. Cada arquivo chama window.__municipios(pacote). Na versão completa do site,
   todos os pacotes já vêm embutidos em MUN_EMBUTIDO.
   pacote = {uf, nomes: {cod: [nome, ibge]}, anos: {ano: {cargo: {turno: {cand: [ids], mun: {cod: linha}}}}}, paises?}
   linha = [aptos, comparecimento, abstencoes, brancos, nulos, votos do 1º id, votos do 2º id, ...] */
const MUN_EMBUTIDO = JSON.parse(document.getElementById("municipios").textContent);
const MUN = {}, MUN_FALHA = {}, MUN_ESPERA = {};
const ANOS = { "2022": A22, "2026": A26 };
const $ = id => document.getElementById(id);
window.__municipios = p => {
  // chave de busca sem acento; inclui a grafia do TSE quando ela difere da do IBGE (ex.: São Luís x São Luiz do Paraitinga)
  p.busca = Object.entries(p.nomes).map(([cod, v]) => ({ cod, nome: v[0], chave: semAcento(v[0]), alt: v[2] ? semAcento(v[2]) : "" }))
    .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  MUN[p.uf] = p;
  const fila = MUN_ESPERA[p.uf] || [];
  delete MUN_ESPERA[p.uf];
  fila.forEach(f => f());
};
function carregarMun(uf, depois) {
  if (MUN[uf]) return true;
  if (MUN_EMBUTIDO && MUN_EMBUTIDO[uf]) { window.__municipios(MUN_EMBUTIDO[uf]); return true; }
  if (MUN_FALHA[uf]) return false;
  if (!MUN_ESPERA[uf]) {
    MUN_ESPERA[uf] = [];
    const s = document.createElement("script");
    s.src = `municipios/${uf}.js`;
    s.onerror = () => { MUN_FALHA[uf] = true; const fila = MUN_ESPERA[uf] || []; delete MUN_ESPERA[uf]; fila.forEach(f => f()); };
    document.head.appendChild(s);
  }
  if (depois && !MUN_ESPERA[uf].includes(depois)) MUN_ESPERA[uf].push(depois);
  return false;
}
function avisoMun(uf) {
  return MUN_FALHA[uf]
    ? `<div class="aviso">Os dados por município não foram encontrados. Mantenha a pasta "municipios" ao lado deste arquivo, ou abra a versão completa (comparativo_eleicoes_completo.html), que traz tudo embutido.</div>`
    : `<div class="aviso">Carregando os municípios…</div>`;
}
/* Bloco (mesmo formato do estadual) somando uma ou mais localidades de uma UF. */
function blocoMun(anoKey, cargo, turno, uf, cods) {
  const p = MUN[uf], a = p && p.anos[anoKey], t = a && a[cargo] && a[cargo][turno];
  if (!t) return null;
  const linhas = cods.map(c => t.mun[c]).filter(Boolean);
  if (!linhas.length) return null;
  const soma = linhas[0].map((_, i) => linhas.reduce((s, l) => s + l[i], 0));
  const info = {};
  const est = bloco(ANOS[anoKey], cargo, turno, uf);
  (est ? est.candidatos : []).forEach(c => { info[c.id] = c; });
  const votos = soma.slice(5), validos = votos.reduce((s, v) => s + v, 0);
  const candidatos = t.cand.map((id, i) => {
    const c = info[id] || {};
    return { id, pessoa: c.pessoa || "", nome: c.nome || id, partido: c.partido || "", votos: votos[i], pct: validos ? 100 * votos[i] / validos : 0, situacao: "" };
  }).sort((x, y) => y.votos - x.votos || x.nome.localeCompare(y.nome));
  return { aptos: soma[0], comparecimento: soma[1], abstencoes: soma[2], brancos: soma[3], nulos: soma[4], validos, secoes_pct: 100, candidatos, locais: linhas.length };
}
function arvoreExterior() {
  const p = MUN.ZZ;
  if (!p.arvore) {
    p.arvore = {};
    for (const [cod, [pais, regiao]] of Object.entries(p.paises)) {
      const r = p.arvore[regiao] = p.arvore[regiao] || {};
      (r[pais] = r[pais] || []).push(cod);
    }
  }
  return p.arvore;
}
function cidadesExterior(regiao, pais) {
  const arv = arvoreExterior();
  let out = [];
  for (const [r, paises] of Object.entries(arv)) {
    if (regiao && r !== regiao) continue;
    for (const [pa, cods] of Object.entries(paises)) if (!pais || pa === pais) out = out.concat(cods);
  }
  return out;
}
function mudarUf(uf) { estado.uf = uf; estado.mun = null; estado.regiao = estado.pais = ""; estado.grupo = ""; }
function selecionarMun(cod) {
  estado.mun = cod;
  if (estado.uf === "ZZ" && MUN.ZZ && MUN.ZZ.paises[cod]) [estado.pais, estado.regiao] = MUN.ZZ.paises[cod];
  atualizar();
  window.scrollTo({ top: 0 });
}
function nomeMunAtual() {
  const p = MUN[estado.uf];
  return estado.mun && p && p.nomes[estado.mun] ? p.nomes[estado.mun][0] : "";
}
/* O que a aba Presidente/Governador mostra agora: estado, município, ou um recorte do exterior. */
function vista() {
  const cargo = estado.aba, t = estado.turno, uf = estado.uf;
  const r = { b22: null, b26: null, m22: "", m26: "", topo: "", meio: "", rodape: "", sub: false };
  const estadual = () => {
    r.b22 = bloco(A22, cargo, t, uf); r.b26 = bloco(A26, cargo, t, uf);
    r.m22 = motivoSemDados(A22, "2022"); r.m26 = motivoSemDados(A26, "2026");
  };
  if (uf === "BR" && estado.grupo) {  // total de uma região: soma dos estados dela
    const ufs = ufsDaRegiao(estado.grupo);
    r.sub = true;
    r.b22 = blocoSoma(A22, cargo, t, ufs); r.b26 = blocoSoma(A26, cargo, t, ufs);
    r.m22 = motivoSemDados(A22, "2022"); r.m26 = motivoSemDados(A26, "2026");
    r.rodape = tabelaPorEstado(ufs, `1º colocado nos estados da região ${estado.grupo}`);
    return r;
  }
  if (uf === "BR") { estadual(); if (cargo === "presidente") r.meio = tabelaRegioes(); return r; }
  const pronto = carregarMun(uf, atualizar), exterior = uf === "ZZ";
  if (!estado.mun && !(exterior && (estado.regiao || estado.pais))) {
    estadual();
    if (exterior) r.topo = pronto ? seletoresExterior() : "";
    r.rodape = pronto ? (exterior ? tabelaExterior() : tabelaMunicipios()) : avisoMun(uf);
    return r;
  }
  r.sub = true;
  r.topo = exterior ? (pronto ? seletoresExterior() : "") : `<p class="migalha"><button class="link" type="button" data-voltar="1">← ${esc(UF_NOME[uf])} (estado)</button></p>`;
  if (!pronto) { r.m22 = r.m26 = MUN_FALHA[uf] ? "dados municipais não encontrados" : "carregando…"; r.rodape = avisoMun(uf); return r; }
  const cods = estado.mun ? [estado.mun] : cidadesExterior(estado.regiao, estado.pais);
  r.b22 = blocoMun("2022", cargo, t, uf, cods); r.b26 = blocoMun("2026", cargo, t, uf, cods);
  r.m22 = motivoSemDados(A22, "2022"); r.m26 = motivoSemDados(A26, "2026");
  const tem = ano => !!(MUN[uf].anos[ano] && MUN[uf].anos[ano][cargo] && MUN[uf].anos[ano][cargo][t]);
  if (!r.b22 && tem("2022")) r.m22 = exterior ? "sem votação em 2022" : "município criado depois de 2022";
  if (!r.b26 && tem("2026")) r.m26 = exterior ? "sem votação em 2026" : "sem dados em 2026";
  if (exterior && !estado.mun) r.rodape = tabelaExterior();
  return r;
}

/* Tabela ordenável de localidades (municípios de um estado; regiões, países ou cidades do exterior). */
const tab = { busca: "", ordem: "v22", desc: true, itens: [], atributo: "mun" };
const ORDENS = [["v22", "Votos válidos em 2022"], ["v26", "Votos válidos em 2026"], ["p22", "% do 1º colocado em 2022"],
                ["p26", "% do 1º colocado em 2026"], ["vr", "Variação do 1º colocado (2022 → 2026)"], ["nome", "Nome"]];
function resumoLocal(uf, cods) {
  const b22 = blocoMun("2022", estado.aba, estado.turno, uf, cods), b26 = blocoMun("2026", estado.aba, estado.turno, uf, cods);
  const l22 = b22 && b22.validos ? b22.candidatos[0] : null, l26 = b26 && b26.validos ? b26.candidatos[0] : null;
  return { v22: b22 ? b22.validos : null, v26: b26 ? b26.validos : null, l22, l26,
           p22: l22 ? l22.pct : null, p26: l26 ? l26.pct : null, vr: l22 && l26 ? l26.pct - l22.pct : null };
}
function corpoLocais() {
  const termo = semAcento(tab.busca.trim());
  const lista = tab.itens.filter(i => !termo || i.chave.includes(termo));
  const k = tab.ordem, sinal = tab.desc ? -1 : 1;
  lista.sort((a, b) => {
    if (k === "nome") return sinal * -a.nome.localeCompare(b.nome, "pt-BR");
    if (a[k] === null || b[k] === null) return (a[k] === null) - (b[k] === null) || a.nome.localeCompare(b.nome, "pt-BR");
    return sinal * (a[k] - b[k]) || a.nome.localeCompare(b.nome, "pt-BR");
  });
  const lider = (l, v) => l
    ? `<td class="esq"><span class="nm">${esc(l.nome)}</span> ${fPct(l.pct)}<span class="sub2">${fInt(l.votos)} de ${fInt(v)} votos</span></td>`
    : `<td class="esq menor">—</td>`;
  const linhas = lista.map(i => `<tr class="clicavel" data-${tab.atributo}="${esc(i.id)}">
      <td><span class="nm">${esc(i.nome)}</span>${i.extra ? `<span class="sub2">${esc(i.extra)}</span>` : ""}</td>
      <td>${i.v22 === null ? "—" : fInt(i.v22)}</td>${lider(i.l22, i.v22)}
      <td>${i.v26 === null ? "—" : fInt(i.v26)}</td>${lider(i.l26, i.v26)}
      <td>${i.vr === null ? "—" : fDelta(i.vr, " p.p.")}</td></tr>`).join("");
  const conta = $("loc-conta");
  if (conta) conta.textContent = `${fInt(lista.length)} de ${fInt(tab.itens.length)}`;
  return linhas || `<tr><td colspan="6" class="esq">Nada encontrado.</td></tr>`;
}
function tabelaLocais(titulo, nota, itens, atributo, uf) {

}
function tabelaMunicipios() {

function seletoresExterior() {

function tabelaExterior() {
  const arv = arvoreExterior(), p = MUN.ZZ;

  if (estado.pais) {
    const itens = cidadesExterior(estado.regiao, estado.pais).map(c => ({ id: c, nome: p.nomes[c] ? p.nomes[c][0] : c, cods: [c] }));

/* ----- aba Rankings ----- */
const rk = { modo: "ranking", cargo: "presidente", ano: "2022", metrica: "votos", top: 10, minimo: 10000, exterior: true, sentido: "ganho", cand: {} };
function ufsRanking() {
  if (estado.uf !== "BR") return [estado.uf];
  return rk.cargo === "presidente" && rk.exterior ? UFS.concat("ZZ") : UFS.slice();
}
function candidatosRanking(anoKey) {
  const b = bloco(ANOS[anoKey], rk.cargo, estado.turno, rk.cargo === "presidente" ? "BR" : estado.uf);
  return b ? b.candidatos : null;
}
function candidatoEscolhido(anoKey, lista) {
  const chave = [rk.cargo, anoKey, estado.turno, rk.cargo === "presidente" ? "BR" : estado.uf].join("|");
  if (!lista.some(c => c.id === rk.cand[chave])) rk.cand[chave] = lista[0].id;
  return { chave, id: rk.cand[chave] };
}
function linhasRanking(anoKey, id) {
  const out = [];
  for (const uf of ufsRanking()) {
    const p = MUN[uf], a = p && p.anos[anoKey], t = a && a[rk.cargo] && a[rk.cargo][estado.turno];
    if (!t) continue;
    const k = t.cand.indexOf(id);
    if (k < 0) continue;
    for (const cod in t.mun) {
      const l = t.mun[cod];
      let validos = 0;
      for (let i = 5; i < l.length; i++) validos += l[i];
      out.push({ uf, cod, nome: p.nomes[cod] ? p.nomes[cod][0] : cod, votos: l[5 + k], validos, pct: validos ? 100 * l[5 + k] / validos : 0 });
    }
  }
  return out;
}
const rotuloUf = l => (l.uf === "ZZ" ? "Exterior" : l.uf);
const linhaRk = l => `data-rk-uf="${l.uf}" data-rk-cod="${l.cod}"`;
function tabelaRanking(anoKey, id, nome) {
  const todas = linhasRanking(anoKey, id);
  const total = todas.reduce((s, l) => s + l.votos, 0);
  const filtradas = todas.filter(l => l.validos >= rk.minimo);
  const k = rk.metrica === "pct" ? "pct" : "votos";
  filtradas.sort((a, b) => b[k] - a[k] || b.votos - a.votos || a.nome.localeCompare(b.nome, "pt-BR"));
  const linhas = filtradas.slice(0, rk.top).map((l, i) => `<tr class="clicavel" ${linhaRk(l)}><td>${i + 1}º</td>
    <td class="esq"><span class="nm">${esc(l.nome)}</span></td><td class="esq">${rotuloUf(l)}</td>
    <td>${fInt(l.votos)}</td><td>${fPct(l.pct)}</td><td>${fInt(l.validos)}</td></tr>`).join("");
  return `<div class="rk-tabela" data-rk-ano="${anoKey}" data-rk-total="${total}">
    <h4 class="rk-titulo"><span class="amostra a${anoKey}"></span> ${anoKey} · ${esc(nome)} · ${rk.metrica === "pct" ? "% dos votos válidos" : "votos nominais"}</h4>
    <p class="e-nota">${fInt(filtradas.length)} de ${fInt(todas.length)} localidades com pelo menos ${fInt(rk.minimo)} votos válidos. Total do candidato no escopo: ${fInt(total)} votos.</p>
    <div class="rolagem tabela-mun"><table><thead><tr><th>Pos.</th><th class="esq">Município</th><th class="esq">UF</th><th>Votos do candidato</th><th>% dos válidos</th><th>Votos válidos do município</th></tr></thead>
    <tbody>${linhas || `<tr><td colspan="6" class="esq">Nenhuma localidade atende ao filtro.</td></tr>`}</tbody></table></div></div>`;
}
function tabelaVariacao(c22, c26) {
  const base = {};
  linhasRanking("2022", c22.id).forEach(l => { base[l.uf + l.cod] = l; });
  const pares = linhasRanking("2026", c26.id).filter(l => base[l.uf + l.cod]).map(l => {
    const a = base[l.uf + l.cod];
    return { uf: l.uf, cod: l.cod, nome: l.nome, a, b: l, dv: l.votos - a.votos, dp: l.pct - a.pct };
  }).filter(x => Math.min(x.a.validos, x.b.validos) >= rk.minimo);
  const k = rk.metrica === "pct" ? "dp" : "dv", sinal = rk.sentido === "ganho" ? -1 : 1;
  pares.sort((x, y) => sinal * (x[k] - y[k]) || x.nome.localeCompare(y.nome, "pt-BR"));
  const cls = v => (v > 0 ? "positivo" : v < 0 ? "negativo" : "");
  const linhas = pares.slice(0, rk.top).map((x, i) => `<tr class="clicavel" ${linhaRk(x)}><td>${i + 1}º</td>
    <td class="esq"><span class="nm">${esc(x.nome)}</span></td><td class="esq">${rotuloUf(x)}</td>
    <td>${fInt(x.a.votos)}<span class="sub2">${fPct(x.a.pct)}</span></td><td>${fInt(x.b.votos)}<span class="sub2">${fPct(x.b.pct)}</span></td>
    <td class="${cls(x.dv)}">${x.dv > 0 ? "+" : x.dv < 0 ? "−" : ""}${fInt(Math.abs(x.dv))}</td>
    <td class="${cls(x.dp)}">${x.dp > 0 ? "+" : x.dp < 0 ? "−" : ""}${fDec(Math.abs(x.dp))} p.p.</td></tr>`).join("");
  return `<div class="rk-tabela" data-rk-ano="variacao">
    <p class="e-nota">${fInt(pares.length)} localidades presentes nos dois anos com pelo menos ${fInt(rk.minimo)} votos válidos em ambos.</p>
    <div class="rolagem tabela-mun"><table><thead><tr><th>Pos.</th><th class="esq">Município</th><th class="esq">UF</th>
      <th><span class="amostra a2022"></span> 2022</th><th><span class="amostra a2026"></span> 2026</th><th>Variação em votos</th><th>Variação em p.p.</th></tr></thead>
    <tbody>${linhas || `<tr><td colspan="7" class="esq">Nenhuma localidade atende ao filtro.</td></tr>`}</tbody></table></div></div>`;
}
function renderRankings() {

  if (rk.metrica === "pct" && !(rk.minimo >= 1)) rk.minimo = 10000;  // com % o filtro de tamanho é obrigatório

  };

  } else seletorCand = `<label>Candidato nos dois anos<select disabled><option>${c26 ? "nenhum em comum" : "aguardando resultado"}</option></select></label>`;

  else if (faltam.length) corpo = faltam.some(u => MUN_FALHA[u]) ? avisoMun(faltam.find(u => MUN_FALHA[u])) : `<div class="aviso">Carregando os municípios (${ufsRanking().length - faltam.length} de ${ufsRanking().length} arquivos)…</div>`;
  else if (rk.modo === "ranking") {

      : `<div class="aviso">${rk.ano}: ${rk.ano === "2026" ? "aguardando resultado" : motivoRanking()}.</div>`;
  } else if (rk.modo === "lado") {

  else {

  const podeExterior = rk.cargo === "presidente" && uf === "BR";
  return `<section class="cartao" id="rankings"><h3>Rankings por município</h3>
    <p class="nota">Municípios (e cidades do exterior, para presidente) ordenados pelos votos de um candidato. O escopo é o local escolhido no mapa ou na lista: Brasil ou um estado. Clique em uma linha para abrir a comparação do município.</p>
    <div class="rk-grade">
      <label>Modo<select data-rk="modo">${op("ranking", "Ranking de um ano", rk.modo === "ranking")}${op("variacao", "Variação 2022 × 2026", rk.modo === "variacao")}${op("lado", "Lado a lado (2022 e 2026)", rk.modo === "lado")}</select></label>

      <label>Mostrar<select data-rk="top">${[10, 20, 50].map(n => op(n, `Top ${n}`, rk.top === n)).join("")}</select></label>

    </div>
